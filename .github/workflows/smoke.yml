name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Use the Chrome that ships on GitHub's Ubuntu runner. Downloading
    # Playwright's Chromium (+ apt packages) was the slow, flaky step.
    env:
      PW_CHROMIUM: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Show Chrome version
        run: '"$PW_CHROMIUM" --version'

      - name: Run smoke suite
        working-directory: tests
        run: node smoke.js

      - name: Run interaction flows
        working-directory: tests
        run: node flows.js

      - name: Run Vault Bridge checks
        working-directory: tests
        run: node vault-bridge.js
