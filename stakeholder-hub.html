<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; font-src 'self'; connect-src 'self' https://api.anthropic.com; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stakeholder Map</title>
  <script src="hub-storage.js"></script>
  <script src="hub-utils.js"></script>
  <script src="hub-links.js"></script>
  <script src="hub-data.js"></script>
  <script src="hub-toast.js"></script>
  <script src="hub-bootstrap.js"></script>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── Topbar ── */
    .topbar {
      height: 54px; display: flex; align-items: center; gap: 10px;
      padding: 0 20px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; background: var(--surface);
    }
    @media (max-width: 640px) {
      .topbar { height: auto; min-height: 54px; flex-wrap: wrap; padding: 8px 12px; row-gap: 8px; }
    }
    .logo-mark {
      width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #111; font-family: var(--font-display); flex-shrink: 0;
    }
    .logo-text { font-family: var(--font-display); font-size: 13.5px; font-weight: 800; }
    .topbar-spacer { flex: 1; }
    .project-filter {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm);
      color: var(--text); font-family: var(--font-body); font-size: 12px;
      padding: 5px 10px; cursor: pointer; outline: none;
    }
    .project-filter:focus { border-color: var(--accent); }

    /* ── Body ── */
    .body-wrap { flex: 1; display: flex; overflow: hidden; }

    /* ── Stakeholder card ── */
    .sh-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 7px 10px; cursor: pointer; transition: border-color 0.12s; display: flex; align-items: center; gap: 8px;
    }
    .sh-card:hover { border-color: var(--border2); }
    .sh-card.selected { border-color: var(--accent); }
    .sh-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text2); flex-shrink: 0; overflow: hidden;
    }
    .sh-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sh-avatar .sh-avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .url-preview-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: var(--r-sm);
      background: var(--surface2); border: 1px solid var(--border); margin-top: 6px;
    }
    .url-preview-icon {
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      background: var(--surface3); border-radius: 50%; font-size: 13px; flex-shrink: 0; overflow: hidden;
    }
    .url-preview-icon img { width: 100%; height: 100%; object-fit: cover; }
    .url-preview-domain { font-size: 11px; color: var(--text2); font-family: var(--font-mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-preview-auto { font-size: 9px; color: var(--accent); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
    .sh-info { flex: 1; min-width: 0; }
    .sh-name { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sh-role { font-size: 10.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .waiting-badge { font-size: 12px; flex-shrink: 0; cursor: help; }
    .q-add-btn {
      background: none; border: 1px dashed var(--border); border-radius: var(--r-sm);
      color: var(--text3); font-size: 11px; padding: 4px; cursor: pointer;
      text-align: center; transition: all 0.12s; flex-shrink: 0; font-family: var(--font-body);
    }
    .q-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Detail panel ── */
    .detail-panel {
      width: 420px; min-width: 420px; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--surface); overflow: hidden;
    }
    .dp-header {
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .dp-title { font-family: var(--font-display); font-size: 13.5px; font-weight: 800; flex: 1; }
    .dp-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 17px; }
    .dp-close:hover { color: var(--text); }
    .dp-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .dp-body::-webkit-scrollbar { width: 4px; }
    .dp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .dp-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-shrink: 0; }
    .dp-footer .spacer { flex: 1; }

    .field-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
    .field-input, .field-textarea, .field-select {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 9px; color: var(--text);
      font-family: var(--font-body); font-size: 12.5px; outline: none; transition: border-color 0.15s;
    }
    .field-textarea { resize: vertical; min-height: 60px; }
    .field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent); }

    /* ── Slider ── */
    /* ── Add modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r);
      width: 380px; max-width: 94vw; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .modal-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .modal-title { font-family: var(--font-display); font-size: 14px; font-weight: 800; flex: 1; }
    .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .modal-footer .spacer { flex: 1; }

    /* ── View tabs ── */
    /* ── Organizations view ── */
    .orgs-area { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
    .orgs-area::-webkit-scrollbar { width: 6px; }
    .orgs-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .org-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
    .org-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .org-name { font-family: var(--font-display); font-size: 14px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .org-type-badge { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: var(--r-chip); flex-shrink: 0; }
    .org-type-badge.vendor { background: var(--node-blue); color: var(--border-blue); border: 1px solid var(--border-blue); }
    .org-type-badge.consultant { background: var(--node-purple); color: var(--border-purple); border: 1px solid var(--border-purple); }
    .org-type-badge.dept { background: var(--accent2-dim); color: var(--accent2); border: 1px solid var(--accent2); }
    .org-type-badge.none { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
    .org-proj-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .org-proj-chip { font-size: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-chip); padding: 2px 7px; color: var(--text2); }
    .org-members { display: flex; flex-direction: column; gap: 5px; }
    .org-add-person { margin-top: 8px; }
    .orgs-empty { color: var(--text3); font-size: 13px; text-align: center; padding: 40px 0; }

    /* ── Drag & drop (persons ↔ orgs, org reordering) ── */
    .org-drag-handle { cursor: grab; color: var(--text3); font-size: 13px; flex-shrink: 0; }
    .org-card[draggable="true"] { cursor: default; }
    .org-card.org-drag-src { opacity: 0.4; }
    .org-card.drag-over-org { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .sh-card[draggable="true"] { cursor: grab; }
    .sh-card.person-drag-src { opacity: 0.4; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo-mark">◇</div>
  <div class="logo-text">Stakeholder Map</div>
  <div class="topbar-spacer"></div>
  <select class="project-filter" id="project-filter" onchange="renderAll()">
    <option value="">All projects</option>
  </select>
  <button class="btn btn-primary" onclick="openAddModal()" style="font-size:12px;padding:6px 14px">+ Add stakeholder</button>
</div>

<div class="body-wrap">
  <div class="orgs-area" id="orgs-area"></div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detail-panel" style="display:none">
    <div class="dp-header">
      <div class="dp-title" id="dp-title">Stakeholder</div>
      <button class="dp-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="dp-body">
      <div>
        <div class="field-label">Name</div>
        <input class="field-input" id="dp-name" oninput="dpChange()" />
      </div>
      <div>
        <div class="field-label">Role / Title</div>
        <input class="field-input" id="dp-role" oninput="dpChange()" />
      </div>
      <div>
        <div class="field-label">Website / Profile URL</div>
        <input class="field-input" id="dp-url" oninput="dpChange();renderUrlPreview()" placeholder="https://..." />
        <div id="dp-url-preview"></div>
      </div>
      <div>
        <div class="field-label">Organization</div>
        <input class="field-input" id="dp-org" oninput="dpChange()" list="org-suggestions" placeholder="Company or department name" />
      </div>
      <div>
        <div class="field-label">Org Type</div>
        <select class="field-select" id="dp-orgtype" onchange="dpChange()">
          <option value="">— unset —</option>
          <option value="vendor">Vendor</option>
          <option value="consultant">Consultant</option>
          <option value="dept">Internal Department</option>
        </select>
      </div>
      <div>
        <div class="field-label">Waiting on / current ask</div>
        <textarea class="field-textarea" id="dp-waiting" oninput="dpChange()" placeholder="What do you need from them right now? Leave blank once it's resolved."></textarea>
      </div>
      <div>
        <div class="field-label">Notes</div>
        <textarea class="field-textarea" id="dp-notes" oninput="dpChange()"></textarea>
      </div>
      <div>
        <div class="field-label">Projects</div>
        <div id="dp-projects"></div>
      </div>
    </div>
    <div class="dp-footer">
      <button class="btn btn-primary" onclick="saveDetail()">Save</button>
      <button class="btn btn-ghost" onclick="closeDetail()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-danger" onclick="deleteStakeholder()">Delete</button>
    </div>
  </div>
</div>

<!-- Quick-add modal -->
<div class="modal-overlay" id="add-modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add Stakeholder</div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Existing stakeholder <span style="color:var(--text3);font-size:10px;font-weight:400">(single source of truth — link instead of duplicating)</span></div>
        <select class="field-select" id="am-existing" onchange="onExistingPick()">
          <option value="">+ New stakeholder</option>
        </select>
      </div>
      <div id="am-new-fields">
        <div>
          <div class="field-label">Name *</div>
          <input class="field-input" id="am-name" placeholder="Full name" list="am-name-suggestions" oninput="onAmNameInput()" />
          <datalist id="am-name-suggestions"></datalist>
        </div>
        <div>
          <div class="field-label">Role / Title</div>
          <input class="field-input" id="am-role" placeholder="Role or organisation" />
        </div>
        <div>
          <div class="field-label">Organization</div>
          <input class="field-input" id="am-org" placeholder="Company or department name" list="org-suggestions" />
        </div>
        <div>
          <div class="field-label">Org Type</div>
          <select class="field-select" id="am-orgtype">
            <option value="">— unset —</option>
            <option value="vendor">Vendor</option>
            <option value="consultant">Consultant</option>
            <option value="dept">Internal Department</option>
          </select>
        </div>
      </div>
      <div id="am-existing-hint" style="display:none;font-size:11.5px;color:var(--text3);padding:2px 0"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveNewStakeholder()">Add</button>
      <button class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
    </div>
  </div>
</div>

<datalist id="org-suggestions"></datalist>

<script>
  const STORAGE_KEY = 'stakeholder-hub-v1';

  let data = { stakeholders: [] };
  let activeId = null;
  let projectFilter = '';
  const ORG_TYPE_LABELS = { vendor: 'Vendor', consultant: 'Consultant', dept: 'Internal Dept', '': 'Unset' };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function load() {
    data = HubStorage.get(STORAGE_KEY) || { stakeholders: [] };
    if (!data.stakeholders) data.stakeholders = [];
  }
  function save() { HubStorage.set(STORAGE_KEY, data); }

  function initials(name) {
    return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  }

  function urlDomain(url) {
    try { return new URL(url).hostname || null; } catch { return null; }
  }

  function shAvatarHtml(sh) {
    const fb = _esc(initials(sh.name));
    const domain = sh.url ? urlDomain(sh.url) : null;
    if (!domain) return `<span class="sh-avatar-fallback">${fb}</span>`;
    return `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><span class="sh-avatar-fallback" style="display:none">${fb}</span>`;
  }

  function renderUrlPreview() {
    const el = document.getElementById('dp-url-preview');
    const url = document.getElementById('dp-url').value.trim();
    const domain = url ? urlDomain(url) : null;
    if (!domain) { el.innerHTML = ''; return; }
    const fb = _esc(initials(document.getElementById('dp-name').value));
    el.innerHTML = `<div class="url-preview-row">
      <div class="url-preview-icon"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><span style="display:none">${fb}</span></div>
      <span class="url-preview-domain">${_esc(domain)}</span>
      <span class="url-preview-auto">auto</span>
    </div>`;
  }

  // ── Project filter ───────────────────────────────────────────────────────────

  function buildProjectFilter() {
    const sel = document.getElementById('project-filter');
    const projects = (() => { try { return HubData.getProjects(); } catch { return []; } })()
      .slice().sort((a, b) => (a.name||'').localeCompare(b.name||''));
    sel.innerHTML = '<option value="">All projects</option>' +
      projects.map(p => `<option value="${_esc(p.id)}">${_esc(p.name)}</option>`).join('');
  }

  function buildOrgSuggestions() {
    const dl = document.getElementById('org-suggestions');
    const orgs = [...new Set(data.stakeholders.map(s => (s.org||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    dl.innerHTML = orgs.map(o => `<option value="${_esc(o)}"></option>`).join('');
  }

  function renderAll() {
    projectFilter = document.getElementById('project-filter').value;
    buildOrgSuggestions();
    renderOrgsView();
  }

  // ── Organizations view ───────────────────────────────────────────────────────

  function getOrgGroups(items) {
    const map = new Map();
    items.forEach(sh => {
      const key = (sh.org || '').trim();
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(sh);
    });
    const named = [...map.keys()].filter(k => k);
    const order = data.orgOrder || [];
    named.sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    const groups = named.map(name => ({ name, orgType: (map.get(name).find(s=>s.orgType)||{}).orgType || '', members: map.get(name) }));
    if (map.has('')) groups.push({ name: '', orgType: '', members: map.get('') });
    return groups;
  }

  // ── Drag & drop: persons between orgs, org-card reordering ─────────────────
  let personDragSrc = null;
  let orgDragSrc = null;

  function onPersonDragStart(e, id) {
    personDragSrc = id;
    e.currentTarget.classList.add('person-drag-src');
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  }
  function onPersonDragEnd(e) {
    e.currentTarget.classList.remove('person-drag-src');
    personDragSrc = null;
    document.querySelectorAll('.org-card.drag-over-org').forEach(c => c.classList.remove('drag-over-org'));
  }

  function onOrgCardDragStart(e, name) {
    orgDragSrc = name;
    e.currentTarget.classList.add('org-drag-src');
    e.dataTransfer.effectAllowed = 'move';
  }
  function onOrgCardDragEnd(e) {
    e.currentTarget.classList.remove('org-drag-src');
    orgDragSrc = null;
    document.querySelectorAll('.org-card.drag-over-org').forEach(c => c.classList.remove('drag-over-org'));
  }

  function onOrgCardDragOver(e, name) {
    if (!personDragSrc && !(orgDragSrc && orgDragSrc !== name)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over-org');
  }
  function onOrgCardDragLeave(e) {
    e.currentTarget.classList.remove('drag-over-org');
  }
  function onOrgCardDrop(e, name, orgType) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over-org');

    if (personDragSrc) {
      const sh = data.stakeholders.find(s => s.id === personDragSrc);
      personDragSrc = null;
      if (!sh || (sh.org || '') === name) return;
      sh.org = name;
      if (!sh.orgType && orgType) sh.orgType = orgType;
      save();
      showToast(name ? `Moved to ${name}` : 'Removed from organization');
      renderAll();
      return;
    }

    if (orgDragSrc && orgDragSrc !== name) {
      const allNames = getOrgGroups(data.stakeholders).map(g => g.name).filter(Boolean);
      const order = (data.orgOrder && data.orgOrder.length) ? [...data.orgOrder] : [];
      allNames.forEach(n => { if (!order.includes(n)) order.push(n); });
      const fromIdx = order.indexOf(orgDragSrc);
      const toIdx = order.indexOf(name);
      orgDragSrc = null;
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = order.splice(fromIdx, 1);
      order.splice(toIdx, 0, moved);
      data.orgOrder = order;
      save();
      showToast('Organization order updated');
      renderAll();
    }
  }

  function orgProjectIds(members) {
    return [...new Set(members.flatMap(m => m.projectIds || []))];
  }

  // A group of exactly one member whose name equals the org name isn't a
  // person *within* a company — it's the company itself, entered as a single
  // stakeholder. Nesting it under a header repeating its own name just shows
  // "Autodesk" twice; render it as one compact row instead.
  function isSelfNamedOrg(g) {
    return g.name && g.members.length === 1
      && (g.members[0].name || '').trim().toLowerCase() === g.name.trim().toLowerCase();
  }

  function renderOrgsView() {
    const el = document.getElementById('orgs-area');
    let items = data.stakeholders;
    if (projectFilter) items = items.filter(sh => (sh.projectIds||[]).includes(projectFilter));
    if (!items.length) {
      el.innerHTML = `<div class="orgs-empty">No stakeholders yet. Click "+ Add stakeholder" to get started.</div>`;
      return;
    }
    const groups = getOrgGroups(items);
    let projectsById = {};
    try { (HubData.getProjects()||[]).forEach(p => projectsById[p.id] = p.name); } catch {}

    el.innerHTML = groups.map(g => {
      const projIds = orgProjectIds(g.members);
      const projChips = projIds.length
        ? `<div class="org-proj-chips">${projIds.map(id => `<span class="org-proj-chip">${_esc(projectsById[id] || 'Unknown project')}</span>`).join('')}</div>`
        : '';
      const orgName = g.name || 'No organization';
      const badgeClass = g.orgType || 'none';
      const badgeLabel = ORG_TYPE_LABELS[g.orgType] || 'Unset';
      const nameJs = (g.name || '').replace(/'/g, "\\'");
      const orgTypeJs = (g.orgType || '').replace(/'/g, "\\'");
      const dragAttrs = g.name
        ? `draggable="true" ondragstart="onOrgCardDragStart(event,'${nameJs}')" ondragend="onOrgCardDragEnd(event)"`
        : '';

      if (isSelfNamedOrg(g)) {
        const sh = g.members[0];
        const waitBadge = sh.waitingOn ? `<span class="waiting-badge" title="Waiting on: ${_esc(sh.waitingOn)}">⏳</span>` : '';
        return `<div class="org-card" ${dragAttrs}
          ondragover="onOrgCardDragOver(event,'${nameJs}')" ondragleave="onOrgCardDragLeave(event)" ondrop="onOrgCardDrop(event,'${nameJs}','${orgTypeJs}')"
          onclick="openDetail('${sh.id}')" style="cursor:pointer">
          <div class="org-card-head">
            <span class="org-drag-handle">⠿</span>
            <div class="sh-avatar" style="width:22px;height:22px;font-size:10px">${shAvatarHtml(sh)}</div>
            <div class="org-name">${_esc(orgName)}</div>
            ${waitBadge}
            <span class="org-type-badge ${badgeClass}">${_esc(badgeLabel)}</span>
          </div>
          ${projChips}
        </div>`;
      }

      const membersHtml = g.members.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(sh => renderCard(sh, true)).join('');
      return `<div class="org-card" ${dragAttrs}
        ondragover="onOrgCardDragOver(event,'${nameJs}')" ondragleave="onOrgCardDragLeave(event)" ondrop="onOrgCardDrop(event,'${nameJs}','${orgTypeJs}')">
        <div class="org-card-head">
          ${g.name ? `<span class="org-drag-handle">⠿</span>` : ''}
          <div class="org-name">${_esc(orgName)}</div>
          <span class="org-type-badge ${badgeClass}">${_esc(badgeLabel)}</span>
        </div>
        ${projChips}
        <div class="org-members">${membersHtml}</div>
        <button class="q-add-btn org-add-person" onclick="openAddModal('${_esc(g.name).replace(/'/g,"\\'")}','${g.orgType||''}')">+ Add person to ${g.name ? _esc(g.name) : 'this org'}</button>
      </div>`;
    }).join('');
  }

  // ── Render ───────────────────────────────────────────────────────────────────

  function renderCard(sh, draggable) {
    const waitBadge = sh.waitingOn ? `<span class="waiting-badge" title="Waiting on: ${_esc(sh.waitingOn)}">⏳</span>` : '';
    const dragAttrs = draggable
      ? `draggable="true" ondragstart="onPersonDragStart(event,'${sh.id}')" ondragend="onPersonDragEnd(event)"`
      : '';
    return `<div class="sh-card${sh.id === activeId ? ' selected' : ''}" data-id="${sh.id}" ${dragAttrs} onclick="openDetail('${sh.id}')">
      <div class="sh-avatar">${shAvatarHtml(sh)}</div>
      <div class="sh-info">
        <div class="sh-name">${_esc(sh.name||'Unnamed')}</div>
        ${sh.role ? `<div class="sh-role">${_esc(sh.role)}</div>` : ''}
      </div>
      ${waitBadge}
    </div>`;
  }

  // ── Detail panel ─────────────────────────────────────────────────────────────

  let _dpProjectIds = [];
  let _dpProjectRoles = {};

  function openDetail(id) {
    activeId = id;
    const sh = data.stakeholders.find(s => s.id === id);
    if (!sh) return;
    document.getElementById('detail-panel').style.display = 'flex';
    document.getElementById('dp-title').textContent = sh.name || 'Stakeholder';
    document.getElementById('dp-name').value = sh.name || '';
    document.getElementById('dp-role').value = sh.role || '';
    document.getElementById('dp-url').value = sh.url || '';
    renderUrlPreview();
    document.getElementById('dp-org').value = sh.org || '';
    document.getElementById('dp-orgtype').value = sh.orgType || '';
    document.getElementById('dp-waiting').value = sh.waitingOn || '';
    document.getElementById('dp-notes').value = sh.notes || '';
    _dpProjectIds = (sh.projectIds || []).slice();
    _dpProjectRoles = { ...(sh.projectRoles || {}) };
    renderProjectChecklist();
    renderOrgsView();
  }

  // ── Project checklist (sorted by Project Hub's saved group order) ─────────────

  function getGroupedSortedProjects() {
    const raw = HubStorage.get('project-hub-v1') || {};
    const projects = Array.isArray(raw.projects) ? raw.projects : [];
    const savedOrder = Array.isArray(raw.groupOrder) ? raw.groupOrder : [];
    const groupMap = new Map();
    projects.forEach(p => {
      const key = (p.group || '').trim();
      if (!groupMap.has(key)) groupMap.set(key, []);
      groupMap.get(key).push(p);
    });
    const namedKeys = [...groupMap.keys()].filter(k => k);
    const known = savedOrder.filter(g => namedKeys.includes(g));
    const extra = namedKeys.filter(g => !known.includes(g)).sort((a, b) => a.localeCompare(b));
    const orderedGroups = [...known, ...extra];
    if (groupMap.has('')) orderedGroups.push('');
    return orderedGroups.map(name => ({
      name,
      projects: (groupMap.get(name) || []).slice().sort((a, b) => a.name.localeCompare(b.name))
    })).filter(g => g.projects.length);
  }

  function renderProjectChecklist() {
    const el = document.getElementById('dp-projects');
    const groups = getGroupedSortedProjects();
    if (!groups.length) {
      el.innerHTML = `<div style="font-size:11.5px;color:var(--text3);font-style:italic">No projects found in Project Hub yet.</div>`;
      return;
    }
    el.innerHTML = groups.map(g => {
      const heading = (g.name || groups.length > 1)
        ? `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:6px 0 3px">${_esc(g.name || 'Ungrouped')}</div>`
        : '';
      const rows = g.projects.map(p => {
        const checked = _dpProjectIds.includes(p.id);
        const roleRow = checked
          ? `<input class="field-input" style="font-size:11.5px;padding:4px 7px;margin:2px 0 4px 20px;width:calc(100% - 20px)" placeholder="Role on this project (optional)" value="${_esc(_dpProjectRoles[p.id] || '')}" onchange="setDpProjectRole('${p.id}',this.value)">`
          : '';
        return `<label style="display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--border)">
          <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleDpProject('${p.id}')" style="accent-color:var(--accent);width:13px;height:13px;flex-shrink:0">
          <span style="flex:1;font-weight:${checked?'600':'400'}">${_esc(p.name)}</span>
        </label>${roleRow}`;
      }).join('');
      return heading + rows;
    }).join('');
  }

  function toggleDpProject(projId) {
    const idx = _dpProjectIds.indexOf(projId);
    if (idx >= 0) { _dpProjectIds.splice(idx, 1); delete _dpProjectRoles[projId]; }
    else _dpProjectIds.push(projId);
    renderProjectChecklist();
  }

  function setDpProjectRole(projId, role) {
    if (role.trim()) _dpProjectRoles[projId] = role.trim();
    else delete _dpProjectRoles[projId];
  }

  function closeDetail() {
    document.getElementById('detail-panel').style.display = 'none';
    activeId = null;
    renderOrgsView();
  }

  function dpChange() {
    document.getElementById('dp-title').textContent = document.getElementById('dp-name').value || 'Stakeholder';
  }

  function saveDetail() {
    const sh = data.stakeholders.find(s => s.id === activeId);
    if (!sh) return;
    sh.name = document.getElementById('dp-name').value.trim();
    sh.role = document.getElementById('dp-role').value.trim();
    sh.url = document.getElementById('dp-url').value.trim();
    sh.org = document.getElementById('dp-org').value.trim();
    sh.orgType = document.getElementById('dp-orgtype').value;
    sh.waitingOn = document.getElementById('dp-waiting').value.trim();
    sh.notes = document.getElementById('dp-notes').value.trim();
    sh.projectIds = _dpProjectIds.slice();
    sh.projectRoles = { ..._dpProjectRoles };
    sh.updatedAt = new Date().toISOString();
    save(); closeDetail();
    showToast('Stakeholder saved');
  }

  function deleteStakeholder() {
    if (!activeId) return;
    if (!confirm('Remove this stakeholder?')) return;
    data.stakeholders = data.stakeholders.filter(s => s.id !== activeId);
    save(); closeDetail();
  }

  // ── Add modal ────────────────────────────────────────────────────────────────

  let _addModalOrg = '';
  let _addModalOrgType = '';

  function openAddModal(presetOrg, presetOrgType) {
    _addModalOrg = presetOrg || '';
    _addModalOrgType = presetOrgType || '';
    document.getElementById('am-existing').value = '';
    document.getElementById('am-name').value = '';
    document.getElementById('am-role').value = '';
    document.getElementById('am-org').value = _addModalOrg;
    document.getElementById('am-orgtype').value = _addModalOrgType;
    buildExistingPicker();
    document.getElementById('am-name-suggestions').innerHTML =
      data.stakeholders.map(s => `<option value="${_esc(s.name)}"></option>`).join('');
    onExistingPick();
    document.getElementById('add-modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('am-name').focus(), 50);
  }
  function closeAddModal() { document.getElementById('add-modal-overlay').classList.remove('open'); }

  // ── Central registry: pick an existing stakeholder instead of duplicating ─────

  function buildExistingPicker() {
    const sel = document.getElementById('am-existing');
    const sorted = data.stakeholders.slice().sort((a, b) => (a.name||'').localeCompare(b.name||''));
    sel.innerHTML = '<option value="">+ New stakeholder</option>' +
      sorted.map(s => `<option value="${s.id}">${_esc(s.name)}${s.role ? ' — ' + _esc(s.role) : ''}</option>`).join('');
  }

  function onExistingPick() {
    const id = document.getElementById('am-existing').value;
    const newFields = document.getElementById('am-new-fields');
    const hint = document.getElementById('am-existing-hint');
    if (!id) {
      newFields.style.display = '';
      hint.style.display = 'none';
      return;
    }
    newFields.style.display = 'none';
    const sh = data.stakeholders.find(s => s.id === id);
    hint.style.display = '';
    hint.textContent = projectFilter
      ? (sh && (sh.projectIds||[]).includes(projectFilter)
          ? 'Already linked to this project.'
          : 'Will link this existing stakeholder to the current project filter.')
      : 'Already in the registry — pick a project filter first to link them to a project.';
  }

  function onAmNameInput() {
    // Warn (non-blocking) if the typed name matches an existing stakeholder, so
    // misspellings/duplicates surface before save instead of after.
    const name = document.getElementById('am-name').value.trim().toLowerCase();
    const hint = document.getElementById('am-existing-hint');
    if (!name) { hint.style.display = 'none'; return; }
    const match = data.stakeholders.find(s => (s.name||'').trim().toLowerCase() === name);
    if (match) {
      hint.style.display = '';
      hint.textContent = `Matches existing stakeholder "${match.name}" — saving will link to them instead of creating a duplicate.`;
    } else {
      hint.style.display = 'none';
    }
  }

  function saveNewStakeholder() {
    const existingId = document.getElementById('am-existing').value;
    const typedName = document.getElementById('am-name').value.trim();
    const existingMatch = existingId
      ? data.stakeholders.find(s => s.id === existingId)
      : data.stakeholders.find(s => (s.name||'').trim().toLowerCase() === typedName.toLowerCase());

    if (existingMatch) {
      if (projectFilter && !(existingMatch.projectIds||[]).includes(projectFilter)) {
        existingMatch.projectIds = [...(existingMatch.projectIds||[]), projectFilter];
        existingMatch.updatedAt = new Date().toISOString();
        save();
        showToast('Linked existing stakeholder to project');
      }
      closeAddModal(); openDetail(existingMatch.id);
      return;
    }

    if (!typedName) { document.getElementById('am-name').focus(); return; }
    const sh = {
      id: uid(), name: typedName, role: document.getElementById('am-role').value.trim(),
      url: '',
      org: document.getElementById('am-org').value.trim(),
      orgType: document.getElementById('am-orgtype').value,
      waitingOn: '',
      projectIds: projectFilter ? [projectFilter] : [],
      projectRoles: {},
      notes: '', createdAt: new Date().toISOString()
    };
    data.stakeholders.push(sh);
    save(); closeAddModal(); openDetail(sh.id);
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────

  document.addEventListener('DOMContentLoaded', () => {
    load();
    buildProjectFilter();
    renderAll();
    HubBootstrap.start('stakeholder-hub');
  });

  window.addEventListener('message', e => {
    if (e.origin !== window.location.origin) return;
    if (e.data?.type === 'hub-highlight' && e.data.itemId) {
      openDetail(e.data.itemId);
    }
  });

  document.getElementById('add-modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('add-modal-overlay')) closeAddModal();
  });
</script>
</body>
</html>
