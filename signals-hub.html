    // ── Library place ────────────────────────────────────────────────────
    function libraryItems() {
      const items = new Map();
      data.news.forEach((n) => items.set(n.url, { ...n, usedIn: [], projectIds: new Set() }));
      data.readings.slice().reverse().forEach((r) => {
        const use = (ids, entry, projectIds) => (ids || []).forEach((id) => {
          const d = r.docs[id];
          if (!d || !d.url) return;
          if (!items.has(d.url)) items.set(d.url, { title: d.title, url: d.url, source: d.source, date: d.date, summary: d.summary || '', usedIn: [], projectIds: new Set() });
          const it = items.get(d.url);
          if (!it.usedIn.some((u) => u.title === entry.title)) it.usedIn.push(entry);
          projectIds.forEach((p) => it.projectIds.add(r.projects[p] || p));
        });
        r.insights.forEach((x) => {
          use(x.citations, { kind: 'insight', title: x.headline }, (x.projects || []).map((p) => p.projectId));
          (x.projects || []).forEach((p) => use(p.citations, { kind: 'insight', title: x.headline }, [p.projectId]));
        });
        r.directions.forEach((m) => use(m.citations, { kind: 'move', title: m.title }, m.projectIds || []));
      });
      return [...items.values()].map((it) => ({ ...it, projects: [...it.projectIds], state: (data.items[it.url] || {}).state || 'new' }))
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }

    const lib = { text: '', days: 30, group: 'date', show: 'all', source: '', limit: 60 };
    function renderLibrary() {
      const view = document.getElementById('place-library');
      const all = libraryItems();
      if (!all.length) { view.innerHTML = emptyPage(); wire(view); return; }
      const today = HubUtils.todayLocal();
      const since = lib.days ? HubUtils.localYmd(new Date(Date.now() - lib.days * 86400000)) : '';
      const text = lib.text.toLowerCase();
      const inTime = all.filter((it) => !since || !it.date || it.date >= since);
      const shown = inTime.filter((it) => {
        if (lib.show === 'used' && !it.usedIn.length) return false;
        if (lib.source && it.source !== lib.source) return false;
        return !text || `${it.title} ${it.summary}`.toLowerCase().includes(text);
      });
      const sourceCounts = {};
      inTime.forEach((it) => { sourceCounts[it.source || 'Unknown'] = (sourceCounts[it.source || 'Unknown'] || 0) + 1; });
      const weekAgo = HubUtils.localYmd(new Date(Date.now() - 7 * 86400000));
      const groupOf = (it) => {
        if (lib.group === 'source') return [it.source || 'Unknown'];
        if (lib.group === 'theme') return it.usedIn.length ? it.usedIn.map((u) => u.title) : ['Not used by Claude yet'];
        if (lib.group === 'project') return it.projects.length ? it.projects : ['No project'];
        return [it.date === today ? 'Today' : it.date >= weekAgo ? 'This week' : 'Earlier'];
      };
      const groups = new Map();
      shown.slice(0, lib.limit).forEach((it) => groupOf(it).forEach((g) => { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); }));
      const seg = (name, value, label) => `<button type="button" class="${lib[name] === value ? 'on' : ''}" data-lib="${name}" data-v="${value}">${label}</button>`;
      const usedCount = inTime.filter((it) => it.usedIn.length).length;
      view.innerHTML = `
        <div class="lib-intro"><div class="mono">Library</div><h1>Everything collected, your way.</h1>
          <p>No need to go through it. Claude reads it for each reading. Slice it when you are curious; comment naturally when something matters.</p></div>
        <div class="lib">
          <aside class="rail">
            <input type="search" id="lib-text" placeholder="Search titles and summaries…" value="${esc(lib.text)}" aria-label="Search the library">
            <div><div class="mono">When</div><div class="seg">${seg('days', 7, '7 days')}${seg('days', 30, '30 days')}${seg('days', 0, 'All')}</div></div>
            <div><div class="mono">Group by</div><div class="seg">${seg('group', 'date', 'Date')}${seg('group', 'theme', "Claude's themes")}${seg('group', 'project', 'Project')}${seg('group', 'source', 'Source')}</div></div>
            <div><div class="mono">Show</div><div class="stack">${[['all', 'Everything'], ['used', 'Used by Claude']].map(([v, l]) => `<button type="button" class="${lib.show === v ? 'on' : ''}" data-lib="show" data-v="${v}"><span>${l}</span></button>`).join('')}</div></div>
            <div><div class="mono">Sources</div><div class="stack"><button type="button" class="${lib.source ? '' : 'on'}" data-lib="source" data-v=""><span>All sources</span><span class="n">${inTime.length}</span></button>${Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<button type="button" class="${lib.source === s ? 'on' : ''}" data-lib="source" data-v="${esc(s)}"><span>${esc(s)}</span><span class="n">${n}</span></button>`).join('')}</div></div>
          </aside>
          <div>
            <div class="lib-count">${shown.length} items · <b>${usedCount} used by Claude</b> · ${all.length} in the library</div>
            ${shown.length ? [...groups.entries()].map(([g, items]) => `<div class="group-head"><h2>${esc(g)}</h2><span class="n">${items.length}</span></div>
              <div class="cards">${items.map(itemCard).join('')}</div>`).join('') : '<div class="empty-state"><div class="e-title">Nothing matches</div><div class="e-sub">Widen the time or clear the search.</div></div>'}
            ${shown.length > lib.limit ? `<button class="btn btn-ghost more" type="button" data-lib="more">Show ${Math.min(60, shown.length - lib.limit)} more</button>` : ''}
          </div>
        </div>`;
      const textEl = view.querySelector('#lib-text');
      textEl.oninput = () => {
        lib.text = textEl.value; lib.limit = 60;
        const pos = textEl.selectionStart;
        renderLibrary();
        const again = document.getElementById('lib-text');
        again.focus(); again.setSelectionRange(pos, pos);
      };
      view.querySelectorAll('[data-lib]').forEach((b) => {
        b.onclick = () => {
          const name = b.dataset.lib;
          if (name === 'more') lib.limit += 60;
          else { lib[name] = name === 'days' ? Number(b.dataset.v) : b.dataset.v; lib.limit = 60; }
          renderLibrary();
        };
      });
      view.querySelectorAll('[data-comment-kind]').forEach((b) => { b.onclick = () => openComment(b.dataset.commentKind, b.dataset.commentRef, b.dataset.commentTitle); });
    }
    function itemCard(it) {
      return `<div class="card item${it.usedIn.length ? ' used' : ''}${it.state === 'dismissed' ? ' dim' : ''}">
        <div class="item-top"><b>${esc(it.source)}</b>${it.date ? `<span>${esc(it.date)}</span>` : ''}${it.projects.slice(0, 3).map((p) => `<span class="chip-p">${esc(p)}</span>`).join('')}</div>
        <h3><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a></h3>
        ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ''}
        ${it.usedIn.length ? `<div class="used-box">${it.usedIn.slice(0, 3).map((u) => `<div><span class="k ${u.kind === 'move' ? 'm' : 'i'}">${u.kind === 'move' ? "CLAUDE'S MOVE" : "CLAUDE'S INSIGHT"}</span>${esc(u.title)}</div>`).join('')}</div>` : ''}
        <div class="acts"><button class="mark" type="button" data-comment-kind="item" data-comment-ref="${esc(it.url)}" data-comment-title="${esc(it.title)}">💬 Comment</button></div>
      </div>`;
    }

    // ── Brief place ──────────────────────────────────────────────────────
    function briefParts(reading) {
      const order = [];
      const num = (id) => { if (!order.includes(id)) order.push(id); return order.indexOf(id) + 1; };
      const calls = { forward: [], open: [] };
      reading.directions.forEach((m, i) => {
        const t = latestTap(reading.requestId, i);
        calls[t && ['take-forward', 'follow'].includes(t.reaction) ? 'forward' : 'open'].push({ title: m.title, reason: t && t.reason });
      });
      const touched = projectCounts(reading);
      const horizon = reading.directions.filter((m) => !(m.projectIds || []).length);
      return { num, order, calls, touched, horizon };
    }
    function renderBrief() {
      const view = document.getElementById('place-brief');
      const reading = current();
      if (!reading) { view.innerHTML = emptyPage(); wire(view); return; }
      const day = dayOf(reading);
      const { num, order, calls, touched, horizon } = briefParts(reading);
      const sigNotes = (reading.signalNotes || []).map((n) => ({ ...n, sig: data.signals.find((x) => x.id === n.signalId) })).filter((n) => n.sig);
      const sup = (ids) => {
        const n = (ids || []).filter((id) => reading.docs[id]).map(num);
        return n.length ? `<sup>${n.length > 2 ? `${n[0]}–${n[n.length - 1]}` : n.join(',')}</sup>` : '';
      };
      const insights = reading.insights.map((x, i) => `<div class="b-item"><div class="num">${i + 1}</div><div>
        <h3>${esc(x.headline)}${sup(x.citations)}</h3>
        ${x.summary ? `<p>${esc(x.summary)}</p>` : ''}
        <div class="meta">${x.confidence ? `${esc(x.confidence)} confidence` : ''}${(x.projects || []).length ? ' · ' + (x.projects || []).map((p) => esc(reading.projects[p.projectId] || p.projectId)).join(', ') : ''}</div>
        ${x.firstStep ? `<div class="try"><b>Try:</b> ${esc(x.firstStep)}</div>` : ''}
      </div></div>`).join('');
      const callList = (title, rows) => `<div><h4>${title}</h4>${rows.length ? `<ul>${rows.map((r) => `<li>${esc(r.title)}${r.reason ? ` <span class="m">(${esc(r.reason)})</span>` : ''}</li>`).join('')}</ul>` : '<ul><li>—</li></ul>'}</div>`;
      view.innerHTML = `
        <div class="brief-bar"><div><div class="mono">Brief</div><p>One page from Claude's reading, your comments and explicit choices. Nothing to fill in.</p></div>
          <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-primary btn-s" type="button" data-brief="print">Print or save PDF</button>
            <button class="btn btn-ghost btn-s" type="button" data-brief="copy">Copy as text</button>
            <button class="btn btn-ghost btn-s" type="button" data-brief="md">Download Markdown</button>
          </div></div>
        <article class="paper">
          <div class="mono">Signals Hub brief · Week ${isoWeek(day)} · ${esc(day)}</div>
          <h1>${esc(reading.insights[0] ? reading.insights[0].headline : 'Signals Hub brief')}</h1>
          <div class="lede">Claude read ${reading.evidenceCount || '—'} sources · ${esc(reading.reviewer)}.${reading.weekPlan ? ` <b>This week:</b> ${esc(reading.weekPlan)}` : ''}</div>
          <h2><span>01</span>What changed</h2>${insights}
          <h2><span>02</span>Your choices</h2>
          <div class="calls">${callList('Taken forward', calls.forward)}${callList('Not taken forward', calls.open)}</div>
          ${data.notes.length ? `<h2><span>✦</span>Your comments</h2><ul class="b-list">${data.notes.slice(0, 12).map((n) => `<li>${esc(n.text)}${n.about?.title ? ` <span class="m">— ${esc(n.about.title)}</span>` : ''}</li>`).join('')}</ul>` : ''}
          <h2><span>03</span>Projects touched</h2>
          <ul class="b-list">${touched.map((p) => `<li><b>${esc(p.name)}</b> — ${esc(p.top)}</li>`).join('') || '<li>None.</li>'}</ul>
          ${horizon.length ? `<h2><span>04</span>On the horizon</h2><ul class="b-list">${horizon.map((m) => `<li>${esc(m.title)}</li>`).join('')}</ul>` : ''}
          ${sigNotes.length ? `<h2><span>✦</span>Your signals</h2><ul class="b-list">${sigNotes.map((n) => `<li><b>${esc(n.sig.title)}</b> — ${esc({ supports: 'supports', contradicts: 'against', 'new-angle': 'new angle' }[n.verdict] || n.verdict)}: ${esc(n.note)}${sup(n.citations)}</li>`).join('')}</ul>` : ''}
          <h2><span>${horizon.length ? '05' : '04'}</span>Sources</h2>
          <ol class="b-src">${order.map((id) => { const d = reading.docs[id]; return `<li><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.title)}</a> · ${esc(d.source)}${d.date ? ' · ' + esc(d.date) : ''}</li>`; }).join('')}</ol>
        </article>`;
      view.querySelectorAll('[data-brief]').forEach((b) => {
        b.onclick = async () => {
          const md = briefMarkdown(reading);
          if (b.dataset.brief === 'print') window.print();
          else if (b.dataset.brief === 'md') download(`signals-brief-${day}.md`, md, 'text/markdown');
          else { try { await navigator.clipboard.writeText(md); showToast('Brief copied.'); } catch { showToast('Could not copy.', 'error'); } }
        };
      });
    }
    function briefMarkdown(reading) {
      const day = dayOf(reading);
      const { num, order, calls, touched, horizon } = briefParts(reading);
      const refs = (ids) => { const n = (ids || []).filter((id) => reading.docs[id]).map(num); return n.length ? ` [${n.join(', ')}]` : ''; };
      const lines = [`# ${reading.insights[0] ? reading.insights[0].headline : 'Signals Hub brief'}`, '', `Signals Hub brief · Week ${isoWeek(day)} · ${day}`, ''];
      if (reading.weekPlan) lines.push(`**This week:** ${reading.weekPlan}`, '');
      lines.push('## What changed', '');
      reading.insights.forEach((x, i) => {
        lines.push(`${i + 1}. **${x.headline}**${refs(x.citations)}`);
        if (x.summary) lines.push(`   ${x.summary}`);
        if (x.firstStep) lines.push(`   Try: ${x.firstStep}`);
      });
      lines.push('', '## Your calls', '');
      [['Taken forward', calls.forward], ['Not taken forward', calls.open]].forEach(([t, rows]) => {
        lines.push(`**${t}:** ${rows.length ? rows.map((r) => r.title + (r.reason ? ` (${r.reason})` : '')).join('; ') : '—'}`);
      });
      if (data.notes.length) lines.push('', '## Your comments', '', ...data.notes.slice(0, 12).map((n) => `- ${n.text}${n.about?.title ? ` — ${n.about.title}` : ''}`));
      lines.push('', '## Projects touched', '', ...touched.map((p) => `- **${p.name}**: ${p.top}`));
      if (horizon.length) lines.push('', '## On the horizon', '', ...horizon.map((m) => `- ${m.title}`));
      const sigNotes = (reading.signalNotes || []).map((n) => ({ ...n, sig: data.signals.find((x) => x.id === n.signalId) })).filter((n) => n.sig);
      if (sigNotes.length) lines.push('', '## Your signals', '', ...sigNotes.map((n) => `- **${n.sig.title}** (${n.verdict}): ${n.note}${refs(n.citations)}`));
      lines.push('', '## Sources', '', ...order.map((id, i) => { const d = reading.docs[id]; return `${i + 1}. [${d.title}](${d.url}) · ${d.source}${d.date ? ' · ' + d.date : ''}`; }));
      return lines.join('\n') + '\n';
    }

    // ── Mine place: Onur's own signals (P177) ───────────────────────────
    // A signal is an observation that may matter later. Not a task, not a
    // decision. It grows through links to hub items and Claude's notes, and
    // it may fade. Nothing here changes a stage by itself.
    const STAGES = [
      ['watching', '👀 Watching', 'Noticed. Not enough to act.'],
      ['emerging', '🌱 Emerging', 'Several things point here.'],
      ['act', '🔥 Act', 'Should this become real work?'],
      ['converted', '✅ Converted', 'Became real work.'],
      ['faded', '🧊 Faded', 'Did not develop. That is fine.'],
    ];
    const ACTIVE = ['watching', 'emerging', 'act'];
    const NOUN = {
      'project-hub': 'project item', 'meetings-hub': 'meeting', 'learning-hub': 'learning note', 'decision-hub': 'decision',
      'risk-hub': 'risk', 'goals-hub': 'goal', 'stakeholder-hub': 'organization', 'schedule': 'event', 'idea-swiper': 'idea',
      'canvas-hub': 'canvas card', 'journal-hub': 'journal day', 'tool-portfolio': 'tool', 'tags-hub': 'tag', 'signals-hub': 'signal',
    };
    const hasLinks = () => typeof HubLinks !== 'undefined';
    function signalLinks(id) {
      if (!hasLinks()) return [];
      return HubLinks.getLinksFor('signals-hub', id).map((l) => {
        const other = l.a.tool === 'signals-hub' && l.a.itemId === id ? l.b : l.a;
        return { linkId: l.id, tool: other.tool, itemId: other.itemId, label: other.label || other.itemId };
      });
    }
    function signalNotes(id) {
      const out = [];
      data.readings.forEach((r) => (r.signalNotes || []).forEach((n) => { if (n.signalId === id) out.push({ ...n, reading: r }); }));
      return out;
    }
    function convergence(links, notes) {
      const by = {};
      links.forEach((l) => { by[l.tool] = (by[l.tool] || 0) + 1; });
      const parts = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([tool, n]) => `${n} ${NOUN[tool] || tool}${n > 1 ? 's' : ''}`);
      const support = notes.filter((n) => n.verdict === 'supports').length;
      const against = notes.filter((n) => n.verdict === 'contradicts').length;
      if (support) parts.push(support > 1 ? `${support} readings support it` : '1 reading supports it');
      if (against) parts.push(against > 1 ? `${against} readings point against it` : '1 reading points against it');
      return { parts, kinds: Object.keys(by).length, links: links.length, support };
    }
    function stageHint(sig, conv) {
      if (sig.state === 'watching' && (conv.kinds >= 2 || conv.support >= 1)) return 'Several independent things point here. Move it to Emerging?';
      if (sig.state === 'emerging' && conv.support >= 1 && conv.links >= 3) return 'Evidence keeps adding up. Ready to act?';
      return '';
    }
    function addSignal(title, observation, why) {
      title = String(title || '').trim();
      if (!title) return null;
      const sig = { id: 'sig-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title,
        observation: String(observation || '').trim(), why: String(why || '').trim(), state: 'watching' };
      HubUtils.stampCreate(sig);
      HubUtils.stampUpdate(sig);
      sig.stateAt = sig.createdAt;
      data.signals.unshift(sig);
      save(true); renderMine(); writeState();
      return sig;
    }
    function updateSignal(id, patch) {
      const sig = data.signals.find((x) => x.id === id);
      if (!sig) return;
      if (patch.state && patch.state !== sig.state) sig.stateAt = new Date().toISOString();
      Object.assign(sig, patch);
      HubUtils.stampUpdate(sig);
      save(true); renderMine(); renderRadar(); writeState();
    }
    function deleteSignal(id) {
      if (hasLinks()) signalLinks(id).forEach((l) => HubLinks.removeLink(l.linkId));
      data.signals = data.signals.filter((x) => x.id !== id);
      save(true); renderMine(); writeState();
    }

    let mineShow = 'active';
    let editing = null;
    function signalCard(sig) {
      const links = signalLinks(sig.id);
      const notes = signalNotes(sig.id);
      const conv = convergence(links, notes);
      const hint = ACTIVE.includes(sig.state) ? stageHint(sig, conv) : '';
      if (editing === sig.id) {
        return `<div class="card sig" data-id="${esc(sig.id)}"><div class="sig-edit">
          <input id="edit-title" value="${esc(sig.title)}" aria-label="Signal">
          <textarea id="edit-obs" rows="3" placeholder="What are you noticing?" aria-label="Observation">${esc(sig.observation)}</textarea>
          <textarea id="edit-why" rows="2" placeholder="Why might it matter?" aria-label="Why it may matter">${esc(sig.why)}</textarea>
          <div class="sig-tools"><button type="button" data-sig="save" data-id="${esc(sig.id)}">Save</button><button type="button" data-sig="cancel">Cancel</button><button type="button" data-sig="delete" data-id="${esc(sig.id)}">Delete</button></div>
        </div></div>`;
      }
      return `<div class="card sig${ACTIVE.includes(sig.state) ? '' : ' done'}" data-id="${esc(sig.id)}">
        <h3>${esc(sig.title)}</h3>
        ${sig.observation ? `<div class="obs">${esc(sig.observation)}</div>` : ''}
        ${sig.why ? `<div class="why"><b>Why it may matter.</b> ${esc(sig.why)}</div>` : ''}
        <div class="conv">${conv.parts.length ? conv.parts.map((x) => `<span class="c">${esc(x)}</span>`).join('') : '<span class="c none">Nothing connected yet</span>'}</div>
        ${links.length ? `<div class="links">${links.map((l) => `<button type="button" data-goto="${esc(l.tool)}" data-item="${esc(l.itemId)}" title="${esc(NOUN[l.tool] || l.tool)}">${esc(l.label)}</button>`).join('')}</div>` : ''}
        ${notes.map((n) => `<div class="note"><span class="v ${esc(n.verdict)}">${esc({ supports: 'Supports', contradicts: 'Against', 'new-angle': 'New angle' }[n.verdict] || n.verdict)}</span>${esc(n.note)} <span class="m">· reading of ${esc(dayOf(n.reading))}</span>${sources(n.reading, n.citations)}</div>`).join('')}
        ${hint ? `<div class="hint-move">${esc(hint)}</div>` : ''}
        <div class="stages">${STAGES.map(([k, label]) => `<button type="button" class="${sig.state === k ? 'on' : ''}" data-stage="${k}" data-id="${esc(sig.id)}" title="${esc(STAGES.find((x) => x[0] === k)[2])}">${label}</button>`).join('')}</div>
        <div class="sig-tools">${hasLinks() ? `<button type="button" data-sig="link" data-id="${esc(sig.id)}">🔗 Link to a hub item</button>` : ''}<button type="button" data-sig="edit" data-id="${esc(sig.id)}">Edit</button></div>
      </div>`;
    }

    function renderMine() {
      const view = document.getElementById('place-mine');
      const counts = {};
      data.signals.forEach((x) => { counts[x.state] = (counts[x.state] || 0) + 1; });
      const activeN = ACTIVE.reduce((n, k) => n + (counts[k] || 0), 0);
      const seg = (v, label, n) => `<button type="button" class="${mineShow === v ? 'on' : ''}" data-show="${v}">${label}${n ? ` · ${n}` : ''}</button>`;
      let body;
      if (mineShow === 'active') {
        body = `<div class="lanes">${STAGES.slice(0, 3).map(([k, label, desc]) => {
          const list = data.signals.filter((x) => x.state === k);
          return `<div><div class="lane-head"><div><b>${label}</b><span class="d">${esc(desc)}</span></div><span class="n">${list.length}</span></div>
            <div class="lane">${list.length ? list.map(signalCard).join('') : '<div class="none">None.</div>'}</div></div>`;
        }).join('')}</div>`;
      } else {
        const list = data.signals.filter((x) => mineShow === 'all' || x.state === mineShow);
        body = list.length ? `<div class="sig-grid">${list.map(signalCard).join('')}</div>` : '<div class="empty-state"><div class="e-title">None here</div></div>';
      }
      view.innerHTML = `
        <div class="mine-intro"><div class="mono">Mine</div><h1>What you are noticing.</h1>
          <p>A signal is an observation that may matter later. Not a task, not a decision. Link it to hub items as they touch it; Claude's readings say when outside evidence supports it or points against it. Let it grow, or let it fade.</p></div>
        <form class="card add-sig" id="add-sig" autocomplete="off">
          <input id="sig-title" class="full" placeholder="What are you noticing? e.g. Ontology may become an integration layer" aria-label="New signal">
          <textarea id="sig-obs" rows="2" placeholder="Observation (optional): where do you see it?" aria-label="Observation"></textarea>
          <textarea id="sig-why" rows="2" placeholder="Why might it matter? (optional)" aria-label="Why it may matter"></textarea>
          <div class="acts full"><button class="btn btn-primary btn-s" type="submit">Add signal</button></div>
        </form>
        <div class="mine-bar"><div class="seg">${seg('active', 'Active', activeN)}${seg('converted', 'Converted', counts.converted)}${seg('faded', 'Faded', counts.faded)}${seg('all', 'All', data.signals.length)}</div>
          <span class="hint">${data.signals.length ? 'Claude reads your active signals in the next reading.' : 'Your first signal starts here.'}</span></div>
        ${body}`;
      view.querySelector('#add-sig').onsubmit = (e) => {
        e.preventDefault();
        const sig = addSignal(view.querySelector('#sig-title').value, view.querySelector('#sig-obs').value, view.querySelector('#sig-why').value);
        if (!sig) { view.querySelector('#sig-title').focus(); return; }
        mineShow = 'active';
        renderMine();
        showToast('Signal added. Link it to what it touches.');
      };
      view.querySelectorAll('[data-show]').forEach((b) => { b.onclick = () => { mineShow = b.dataset.show; renderMine(); }; });
      view.querySelectorAll('[data-stage]').forEach((b) => { b.onclick = () => updateSignal(b.dataset.id, { state: b.dataset.stage }); });
      view.querySelectorAll('[data-goto]').forEach((b) => { b.onclick = () => hasLinks() && HubLinks.navigateTo(b.dataset.goto, b.dataset.item); });
      view.querySelectorAll('[data-sig]').forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.id, act = b.dataset.sig;
          const sig = data.signals.find((x) => x.id === id);
          if (act === 'link' && sig) HubLinks.openModal('signals-hub', id, sig.title);
          else if (act === 'edit') { editing = id; renderMine(); const t = document.getElementById('edit-title'); if (t) t.focus(); }
          else if (act === 'cancel') { editing = null; renderMine(); }
          else if (act === 'save') {
            const title = document.getElementById('edit-title').value.trim();
            if (!title) return;
            editing = null;
            updateSignal(id, { title, observation: document.getElementById('edit-obs').value.trim(), why: document.getElementById('edit-why').value.trim() });
          } else if (act === 'delete' && sig && confirm(`Delete the signal "${sig.title}" and its links? Fading keeps it instead.`)) {
            editing = null; deleteSignal(id);
          }
        };
      });
    }

    function readingSignalPanel(reading) {
      const notes = (reading.signalNotes || []).map((n) => ({ ...n, sig: data.signals.find((x) => x.id === n.signalId) })).filter((n) => n.sig);
      if (!notes.length) return '';
      return `<div class="panel card">${section('Your signals', 'what this reading says about them')}${notes.map((n) => `<div class="note" style="margin-top:8px">
        <span class="v ${esc(n.verdict)}">${esc({ supports: 'Supports', contradicts: 'Against', 'new-angle': 'New angle' }[n.verdict] || n.verdict)}</span><b>${esc(n.sig.title)}</b> — ${esc(n.note)}${sources(reading, n.citations)}</div>`).join('')}</div>`;
    }

    // ── Wiring ───────────────────────────────────────────────────────────
    function wire(view, reading) {
      view.querySelectorAll('[data-act]').forEach((b) => {
        b.onclick = () => {
          const act = b.dataset.act;
          if (act === 'link') linkFolder();
          else if (act === 'scan') scanFolder();
          else if (act === 'import') document.getElementById('file-input').click();
          else if (act === 'save') saveTapsFile();
        };
      });
      if (!reading) return;
      view.querySelectorAll('[data-tap]').forEach((b) => {
        b.onclick = () => tap(reading.requestId, Number(b.dataset.i), b.dataset.tap, b.dataset.reason || '');
      });
      view.querySelectorAll('[data-comment-kind]').forEach((b) => {
        b.onclick = () => openComment(b.dataset.commentKind, b.dataset.commentRef, b.dataset.commentTitle);
      });
      view.querySelectorAll('[data-reading-mode]').forEach((b) => {
        b.onclick = () => { readingMode = b.dataset.readingMode; renderRadar(); };
      });
      view.querySelectorAll('[data-copy]').forEach((b) => {
        b.onclick = async () => {
          try { await navigator.clipboard.writeText(reading.directions[Number(b.dataset.copy)].draft || ''); showToast('Draft copied. Edit and send it yourself.'); }
          catch { showToast('Could not copy.', 'error'); }
        };
      });
      view.querySelectorAll('[data-go]').forEach((el) => {
        el.addEventListener('click', () => {
          const target = document.getElementById(el.getAttribute('data-go'));
          if (!target) return;
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 1400);
        });
      });
    }

    function render() {
      renderRadar(); renderLibrary(); renderBrief(); renderMine();
      setStatus(needsPermission ? 'Reconnect the folder to read new files' : statusText, needsPermission || statusWarn);
    }
    function showPlace(name) {
      place = name;
      document.querySelectorAll('.place').forEach((b) => b.classList.toggle('on', b.dataset.place === name));
      ['radar', 'library', 'brief', 'mine'].forEach((p) => document.getElementById('place-' + p).classList.toggle('hidden', p !== name));
      document.getElementById('main').scrollTop = 0;
    }
    document.querySelectorAll('.place').forEach((b) => { b.onclick = () => showPlace(b.dataset.place); });
    document.getElementById('file-input').onchange = (e) => { importFiles([...e.target.files]); e.target.value = ''; };
    document.querySelector('[data-comment-cancel]').onclick = () => document.getElementById('comment-dialog').close();
    document.getElementById('comment-form').onsubmit = (e) => {
      e.preventDefault();
      const text = document.getElementById('comment-text');
      if (!addNote(text.value, commentContext)) return;
      text.value = ''; commentContext = null;
      document.getElementById('comment-dialog').close();
      showToast('Comment saved for the next reading.');
    };

    // A link made in the picker, or a jump here from another tool.
    window.__hl_onLinkChange = () => renderMine();
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'hub-highlight' && data.signals.some((x) => x.id === e.data.itemId)) {
        const sig = data.signals.find((x) => x.id === e.data.itemId);
        mineShow = ACTIVE.includes(sig.state) ? 'active' : 'all';
        renderMine();
        showPlace('mine');
      }
    });

    // For tests and the shell; no storage beyond signals-hub-v1.
    window.SignalsHubTool = { addReading, addNews, importFiles, adoptPcState, stateFile, tap, mark, addNote, render, showPlace, briefMarkdown, addSignal, updateSignal, signalLinks, get data() { return data; } };

    render();
    if (supported()) idb('readonly', (s) => s.get(HANDLE)).then((handle) => { if (handle) useHandle(handle, false); });
    HubBootstrap.start('signals-hub');
  })();
  </script>
</body>
</html>
