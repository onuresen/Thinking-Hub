    const BOARD_FILE_FORMAT = 'thinking-hub-canvas-board';

    function exportBoardFile() {
      const payload = {
        format: BOARD_FILE_FORMAT, version: 1,
        exportedAt: new Date().toISOString(),
        board: { name: db.name, nodes: db.nodes, edges: db.edges || [], lanes: db.lanes || [], panX: db.panX, panY: db.panY, zoom: db.zoom }
      };
      downloadText(`canvas-${fileSlug(db.name)}-${HubUtils.todayLocal()}.json`, JSON.stringify(payload, null, 2), 'application/json');
    }

    // Plain-text line for a node, as it would read in a note.
    function mdNodeLine(n) {
      const kind = { project: 'Project', goal: 'Goal', tool: 'Tool', rd: 'R&D bet' }[n.kind];
      const label = nodeLabel(n).replace(/\s+/g, ' ').trim();
      return kind ? `**${kind}:** ${label}` : label;
    }

    function exportBoardMarkdown() {
      const frames = db.nodes.filter(isFrame);
      const area = f => (f.w || 0) * (f.h || 0);
      // Each node goes under the smallest frame that holds it.
      const home = new Map();
      frames.slice().sort((a, b) => area(b) - area(a)).forEach(f =>
        frameContents(f).filter(n => !isFrame(n)).forEach(n => home.set(n.id, f.id)));
      const byPos = (a, b) => (a.y - b.y) || (a.x - b.x);
      const lines = [`# ${db.name}`, '', `Exported from Thinking Hub Canvas · ${HubUtils.todayLocal()}`, ''];
      const cols = (db.lanes || []).filter(l => l.axis === 'col').sort((a, b) => a.start - b.start);
      const rows = (db.lanes || []).filter(l => l.axis === 'row').sort((a, b) => a.start - b.start);
      if (cols.length || rows.length) {
        lines.push('## Layers', '');
        if (cols.length) lines.push('- **Columns:** ' + cols.map(l => l.label).join(' · '));
        if (rows.length) lines.push('- **Rows:** ' + rows.map(l => l.label).join(' · '));
        lines.push('');
      }
      frames.slice().sort(byPos).forEach(f => {
        const items = db.nodes.filter(n => home.get(n.id) === f.id).sort(byPos);
        lines.push(`## ${nodeLabel(f)}`, '');
        items.forEach(n => lines.push(`- ${mdNodeLine(n)}`));
        if (!items.length) lines.push('- (empty)');
        lines.push('');
      });
      const loose = db.nodes.filter(n => !isFrame(n) && !home.has(n.id)).sort(byPos);
      if (loose.length) {
        lines.push(frames.length ? '## Not in a frame' : '## Nodes', '');
        loose.forEach(n => lines.push(`- ${mdNodeLine(n)}`));
        lines.push('');
      }
      const byId = new Map(db.nodes.map(n => [n.id, n]));
      const edges = (db.edges || []).filter(e => byId.has(e.from) && byId.has(e.to));
      if (edges.length) {
        lines.push('## Connections', '');
        edges.forEach(e => {
          const a = nodeLabel(byId.get(e.from)).split(' · ')[0], b = nodeLabel(byId.get(e.to)).split(' · ')[0];
          const rel = e.relType === 'blocks' ? '→ blocks →' : e.relType === 'depends-on' ? '→ needs →' : '—';
          lines.push(`- ${a} ${rel} ${b}` + (e.label ? ` (${e.label})` : ''));
        });
        lines.push('');
      }
      downloadText(`${fileSlug(db.name)}-${HubUtils.todayLocal()}.md`, lines.join('\n'), 'text/markdown');
    }

    // Board files can come from anyone. Keep only simple text formatting;
    // drop every attribute, script, style and unknown tag.
    const SAFE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'DIV', 'P', 'SPAN', 'UL', 'OL', 'LI']);
    function sanitizeNodeHtml(html) {
      const doc = new DOMParser().parseFromString(`<div>${String(html || '')}</div>`, 'text/html');
      const clean = el => {
        [...el.childNodes].forEach(ch => {
          if (ch.nodeType === 3) return;
          if (ch.nodeType !== 1 || !SAFE_TAGS.has(ch.tagName)) {
            if (ch.nodeType === 1 && !['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'SVG', 'MATH'].includes(ch.tagName)) {
              const txt = document.createTextNode(ch.textContent);
              ch.replaceWith(txt);
            } else ch.remove();
            return;
          }
          [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
          clean(ch);
        });
      };
      const root = doc.body.firstChild;
      clean(root);
      return root.innerHTML;
    }

    const KNOWN_KINDS = new Set(['note', 'goal', 'project', 'tool', 'rd', 'frame']);
    const KNOWN_COLORS = new Set(COLORS.map(c => c.id));
    const KNOWN_LANE_COLORS = KNOWN_COLORS;
    const KNOWN_REL = new Set(EDGE_TYPES.map(t => t.id));

    function importBoardText(text) {
      let data;
      try { data = JSON.parse(text); } catch { throw new Error('Not a JSON file.'); }
      const b = data && data.format === BOARD_FILE_FORMAT ? data.board
        : (data && Array.isArray(data.nodes) ? data : null);
      if (!b || !Array.isArray(b.nodes)) throw new Error('This file is not a Canvas board export.');
      const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
      const nodes = b.nodes.filter(n => n && n.id).map(n => {
        const kind = KNOWN_KINDS.has(n.kind) && n.kind !== 'note' ? n.kind : undefined;
        const out = {
          id: String(n.id), x: num(n.x), y: num(n.y),
          text: kind === 'frame' ? String(n.text || 'Frame').slice(0, 200) : sanitizeNodeHtml(n.text),
          color: KNOWN_COLORS.has(n.color) ? n.color : 'c-gray'
        };
        if (kind) out.kind = kind;
        if (n.w) out.w = Math.max(40, num(n.w));
        if (n.h) out.h = Math.max(30, num(n.h));
        if (n.link && typeof n.link === 'object' && ['project-hub', 'goals-hub', 'tool-portfolio'].includes(n.link.tool)) {
          out.link = { tool: n.link.tool, id: String(n.link.id || ''), label: String(n.link.label || '') };
        }
        return out;
      });
      const edges = (Array.isArray(b.edges) ? b.edges : []).filter(e => e && e.from && e.to).map(e => {
        const out = { id: String(e.id || newEdgeId()), from: String(e.from), to: String(e.to), relType: KNOWN_REL.has(e.relType) ? e.relType : 'relates' };
        if (e.label) out.label = String(e.label).slice(0, 60);
        return out;
      });
      const fresh = cloneWithNewIds(nodes, edges);
      const view = { panX: num(b.panX) || db.panX, panY: num(b.panY) || db.panY, zoom: Math.min(4, Math.max(0.15, num(b.zoom) || 1)), lanes: cleanLanes(b.lanes) };
      const board = addBoard(String(b.name || 'Imported board').slice(0, 80), fresh.nodes, fresh.edges, view);
      // Linked cards whose project/goal/tool doesn't exist here show "(item removed)".
      const known = { project: new Set(liveItemsFor('project').map(i => i.id)), goal: new Set(liveItemsFor('goal').map(i => i.id)), tool: new Set(liveItemsFor('tool').map(i => i.id)) };
      const missing = fresh.nodes.filter(n => n.link && known[n.kind] && !known[n.kind].has(n.link.id)).length;
      return { board, nodes: fresh.nodes.length, edges: fresh.edges.length, missing };
    }

    document.getElementById('board-import-input').addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const r = importBoardText(String(reader.result));
          if (window.showToast) showToast(`Imported "${r.board.name}": ${r.nodes} nodes, ${r.edges} lines` + (r.missing ? ` · ${r.missing} linked items not found here` : ''));
        } catch (err) {
          alert(err.message || 'Could not import this file.');
        }
      };
      reader.readAsText(file);
    });

    // ── Layers (P131) ─────────────────────────────────────────
    // A layer is a named column or row band that runs across the whole
    // board: { id, axis: 'col'|'row', label, start, size, color }.
    // start/size are canvas units along the axis. Layers are a visual
    // guide: they never own or move nodes (frames do that).
    const LANE_SIZE = { col: 260, row: 240 };
    const LANE_MIN = 40;
    let activeLaneId = null;
    let laneDrag = null;   // { lane, mode: 'move'|'lo'|'hi', startMouse, startStart, startSize, pre, moved }

    function lanes() { if (!db.lanes) db.lanes = []; return db.lanes; }
    function newLaneId() { return 'l-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function createLane(axis, start, size, label) {
      pushHistory();
      const snapOn = fullState.snapToGrid;
      const lane = {
        id: newLaneId(), axis,
        label: (label || (axis === 'col' ? 'Column' : 'Row')).slice(0, 80),
        start: snapOn ? snap(start) : Math.round(start),
        size: Math.max(LANE_MIN, snapOn ? snap(size) : Math.round(size)),
        color: 'c-gray'
      };
      lanes().push(lane);
      activeLaneId = lane.id;
      pulseSave(); renderLanes(); renderMinimap();
      return lane;
    }

    function promptNewLane(axis, x, y) {
      const label = prompt(axis === 'col' ? 'Column layer name:' : 'Row layer name:', axis === 'col' ? 'Column' : 'Row');
      if (label === null) return;
      const size = LANE_SIZE[axis];
      createLane(axis, (axis === 'col' ? x : y) - size / 2, size, label.trim() || undefined);
    }

    // Fit a layer to the nodes' bounds, with a small margin.
    function laneAround(axis, ids) {
      const boxes = db.nodes.filter(n => ids.includes(n.id)).map(nodeBox);
      if (!boxes.length) return;
      const lo = Math.min(...boxes.map(b => axis === 'col' ? b.n.x : b.n.y));
      const hi = Math.max(...boxes.map(b => axis === 'col' ? b.n.x + b.w : b.n.y + b.h));
      const label = prompt(axis === 'col' ? 'Column layer name:' : 'Row layer name:', axis === 'col' ? 'Column' : 'Row');
      if (label === null) return;
      createLane(axis, lo - 30, hi - lo + 60, label.trim() || undefined);
    }

    function renameLane(id) {
      const lane = lanes().find(l => l.id === id);
      if (!lane) return;
      const v = prompt('Rename layer:', lane.label);
      if (v === null || !v.trim() || v.trim() === lane.label) return;
      pushHistory(); lane.label = v.trim().slice(0, 80);
      pulseSave(); renderLanes();
    }

    function setLaneColor(id, color) {
      const lane = lanes().find(l => l.id === id);
      if (!lane || lane.color === color) return;
      pushHistory(); lane.color = color;
      pulseSave(); renderLanes(); renderMinimap();
    }

    function deleteLane(id) {
      const i = lanes().findIndex(l => l.id === id);
      if (i < 0) return;
      pushHistory(); lanes().splice(i, 1);
      if (activeLaneId === id) activeLaneId = null;
      pulseSave(); renderLanes(); renderMinimap();
    }

    // Nodes whose centre sits inside the band.
    function laneContents(lane) {
      return db.nodes.filter(n => !isFrame(n)).map(nodeBox).filter(b => {
        const c = lane.axis === 'col' ? b.n.x + b.w / 2 : b.n.y + b.h / 2;
        return c >= lane.start && c <= lane.start + lane.size;
      }).map(b => b.n);
    }

    function setActiveLane(id) {
      if (activeLaneId === id) return;
      activeLaneId = id;
      renderLanes();
    }

    // Build band + header elements; positions come from positionLanes().
    function renderLanes() {
      const bands = document.getElementById('lane-bands');
      const heads = document.getElementById('lane-heads');
      if (!bands || !heads) return;
      bands.innerHTML = ''; heads.innerHTML = '';
      lanes().forEach(lane => {
        const color = KNOWN_LANE_COLORS.has(lane.color) ? lane.color : 'c-gray';
        const act = lane.id === activeLaneId ? ' active' : '';
        const band = document.createElement('div');
        band.className = `lane-band ${lane.axis} ${color}${act}`;
        band.dataset.id = lane.id;
        band.innerHTML = '<div class="lane-fill"></div>';
        bands.appendChild(band);

        const head = document.createElement('div');
        head.className = `lane-head ${lane.axis} ${color}${act}`;
        head.dataset.id = lane.id;
        head.textContent = lane.label;
        head.title = lane.label + ' — drag to move · double-click to rename · right-click for more';
        head.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          e.stopPropagation(); e.preventDefault();
          closeEdgePopover(); closeAddMenu(); closeAddPicker(); closeNodeMenu();
          startLaneDrag(e, lane, 'move');
        });
        head.addEventListener('dblclick', e => { e.stopPropagation(); renameLane(lane.id); });
        head.addEventListener('contextmenu', e => {
          e.preventDefault(); e.stopPropagation();
          const cx = e.clientX, cy = e.clientY;
          gateMenu(() => openLaneMenu(lane.id, cx, cy));
        });
        heads.appendChild(head);

        if (act) {
          ['lo', 'hi'].forEach(side => {
            const g = document.createElement('div');
            g.className = `lane-grip ${lane.axis}`;
            g.dataset.id = lane.id; g.dataset.side = side;
            g.title = 'Drag to resize';
            g.addEventListener('mousedown', e => {
              if (e.button !== 0) return;
              e.stopPropagation(); e.preventDefault();
              startLaneDrag(e, lane, side);
            });
            heads.appendChild(g);
          });
        }
      });
      positionLanes();
    }

    // Place bands and pin headers to the screen edge (like frozen
    // spreadsheet headers). Runs on every pan/zoom.
    const LANE_HEAD_TOP = 52;   // below the board bar
    const LANE_HEAD_LEFT = 8;
    function positionLanes() {
      const heads = document.getElementById('lane-heads');
      if (!heads || !db.lanes || !db.lanes.length) return;
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      db.lanes.forEach(lane => {
        const a = lane.start * db.zoom + (lane.axis === 'col' ? db.panX : db.panY);
        const len = lane.size * db.zoom;
        const band = document.querySelector(`.lane-band[data-id="${lane.id}"]`);
        const head = heads.querySelector(`.lane-head[data-id="${lane.id}"]`);
        if (band) {
          if (lane.axis === 'col') Object.assign(band.style, { left: a + 'px', width: len + 'px', top: '0', height: '100%' });
          else Object.assign(band.style, { top: a + 'px', height: len + 'px', left: '0', width: '100%' });
        }
        const visible = a + len > 0 && a < (lane.axis === 'col' ? vw : vh);
        if (head) {
          if (!visible || len < 24) { head.style.display = 'none'; }
          else {
            head.style.display = '';
            if (lane.axis === 'col') {
              head.style.maxWidth = Math.max(24, Math.min(220, len - 8)) + 'px';
              const w = head.offsetWidth;
              const x = Math.min(Math.max(a + 4, 4), a + len - w - 4);
              head.style.left = x + 'px'; head.style.top = LANE_HEAD_TOP + 'px';
            } else {
              head.style.maxWidth = '180px';
              const h = head.offsetHeight;
              const minTop = LANE_HEAD_TOP + 32, maxTop = vh - 80;
              const y = Math.min(Math.max(a + 4, minTop), a + len - h - 4, maxTop);
              head.style.top = y + 'px'; head.style.left = LANE_HEAD_LEFT + 'px';
              head.style.display = y + h < a || y > a + len ? 'none' : '';
            }
          }
        }
        heads.querySelectorAll(`.lane-grip[data-id="${lane.id}"]`).forEach(g => {
          const at = g.dataset.side === 'lo' ? a : a + len;
          if (lane.axis === 'col') Object.assign(g.style, { left: (at - 3) + 'px', top: '0', height: '100%' });
          else Object.assign(g.style, { top: (at - 3) + 'px', left: '0', width: '100%' });
        });
      });
    }

    function startLaneDrag(e, lane, mode) {
      if (activeLaneId !== lane.id) { activeLaneId = lane.id; renderLanes(); }
      laneDrag = {
        lane, mode,
        startMouse: lane.axis === 'col' ? e.clientX : e.clientY,
        startStart: lane.start, startSize: lane.size,
        pre: snapshotBoard(), moved: false
      };
      document.body.style.cursor = mode === 'move' ? 'grabbing' : (lane.axis === 'col' ? 'col-resize' : 'row-resize');
    }

    function moveLaneDrag(e) {
      const d = laneDrag, lane = d.lane;
      const delta = ((lane.axis === 'col' ? e.clientX : e.clientY) - d.startMouse) / db.zoom;
      if (!d.moved && Math.abs(delta * db.zoom) < PAN_THRESHOLD) return;
      d.moved = true;
      const sn = v => fullState.snapToGrid ? snap(v) : Math.round(v);
      if (d.mode === 'move') lane.start = sn(d.startStart + delta);
      else if (d.mode === 'lo') {
        const end = d.startStart + d.startSize;
        lane.start = Math.min(sn(d.startStart + delta), end - LANE_MIN);
        lane.size = end - lane.start;
      } else lane.size = Math.max(LANE_MIN, sn(d.startStart + d.startSize + delta) - d.startStart);
      positionLanes();
    }

    function endLaneDrag() {
      const d = laneDrag; laneDrag = null;
      document.body.style.cursor = '';
      if (d.moved) { commitGestureHistory(d.pre); pulseSave(); renderMinimap(); }
    }

    function openLaneMenu(id, clientX, clientY) {
      closeEdgePopover(); closeAddMenu(); closeAddPicker();
      const lane = lanes().find(l => l.id === id);
      if (!lane) return;
      setActiveLane(id);
      const menu = document.getElementById('node-menu');
      menu.innerHTML = '';
      const add = (icon, label, action, cls) => {
        const btn = document.createElement('button');
        btn.className = 'qm-item' + (cls ? ' ' + cls : '');
        btn.innerHTML = `<span>${icon}</span><span>${HubUtils.esc(label)}</span>`;
        btn.onmousedown = e => { e.stopPropagation(); closeNodeMenu(); action(); };
        menu.appendChild(btn);
      };
      add('✎', 'Rename layer', () => renameLane(id));
      add('⬚', 'Select nodes in layer', () => {
        const ids = laneContents(lane).map(n => n.id);
        if (!ids.length) return;
        selectedIds = new Set(ids);
        selectedNodeId = ids[ids.length - 1];
        applySelectionClasses();
      });
      const row = document.createElement('div');
      row.className = 'qm-colors';
      COLORS.forEach(c => {
        const dot = document.createElement('button');
        dot.style.background = c.dot;
        dot.title = c.id.replace('c-', '');
        if (lane.color === c.id) dot.classList.add('active');
        dot.onmousedown = e => { e.stopPropagation(); closeNodeMenu(); setLaneColor(id, c.id); };
        row.appendChild(dot);
      });
      menu.appendChild(row);
      const sep = document.createElement('div'); sep.className = 'qm-sep'; menu.appendChild(sep);
      add('✕', 'Delete layer (keeps nodes)', () => deleteLane(id), 'qm-danger');
      menu.style.display = 'flex';
      const h = menu.offsetHeight || 180;
      menu.style.left = Math.min(clientX, window.innerWidth - 200) + 'px';
      menu.style.top = Math.max(8, Math.min(clientY, window.innerHeight - h - 8)) + 'px';
    }

    // Board files and duplicates: clean and re-id layers.
    function cleanLanes(list) {
      const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
      return (Array.isArray(list) ? list : []).filter(l => l && (l.axis === 'col' || l.axis === 'row')).map(l => ({
        id: newLaneId() + Math.random().toString(36).slice(2, 4),
        axis: l.axis,
        label: String(l.label || (l.axis === 'col' ? 'Column' : 'Row')).slice(0, 80),
        start: num(l.start),
        size: num(l.size) > 0 ? Math.max(LANE_MIN, num(l.size)) : LANE_SIZE[l.axis],
        color: KNOWN_LANE_COLORS.has(l.color) ? l.color : 'c-gray'
      }));
    }

    // ── Frames (P129) ─────────────────────────────────────────
    // A frame is a node with kind 'frame': a labelled area drawn behind
    // everything else. Dragging its title moves whatever sits inside it.
    function isFrame(n) { return !!n && n.kind === 'frame'; }

    function createFrame(x, y, w, h, title) {
      pushHistory();
      const id = 'cnv-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      db.nodes.push({ id, x, y, w, h, text: title || 'Frame', color: 'c-gray', kind: 'frame' });
      selectedIds = new Set([id]); selectedNodeId = id;
      renderAll();
      pulseSave();
      return id;
    }

    function wrapInFrame(ids) {
      const boxes = ids.map(id => db.nodes.find(n => n.id === id)).filter(Boolean).map(nodeBox);
      if (!boxes.length) return;
      const pad = 40;
      const L = Math.min(...boxes.map(b => b.n.x)) - pad, T = Math.min(...boxes.map(b => b.n.y)) - pad;
      const R = Math.max(...boxes.map(b => b.n.x + b.w)) + pad, B = Math.max(...boxes.map(b => b.n.y + b.h)) + pad;
      const id = createFrame(L, T, R - L, B - T, 'Frame');
      setTimeout(() => editFrameTitle(id), 30);
    }

    // What sits inside a frame: nodes whose centre is inside it, and
    // smaller frames that fit inside it completely.
    function frameContents(frame) {
      const fx = frame.x, fy = frame.y, fw = frame.w || 0, fh = frame.h || 0;
      return db.nodes.filter(n => n !== frame).filter(n => {
        const b = nodeBox(n);
        if (isFrame(n)) return n.x >= fx && n.y >= fy && n.x + b.w <= fx + fw && n.y + b.h <= fy + fh;
        const cx = n.x + b.w / 2, cy = n.y + b.h / 2;
        return cx >= fx && cx <= fx + fw && cy >= fy && cy <= fy + fh;
      });
    }

    function editFrameTitle(id) {
      const title = layer.querySelector(`.node[data-id="${id}"] .frame-title`);
      if (!title) return;
      title.contentEditable = 'true';
      title.focus();
      const range = document.createRange();
      range.selectNodeContents(title);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }

    function buildFrameEl(node) {
      const el = document.createElement('div');
      el.className = `node frame ${node.color || 'c-gray'}`;
      if (selectedIds.has(node.id)) el.classList.add(selectedIds.size > 1 ? 'in-selection' : 'selected');
      el.dataset.id = node.id;
      el.style.left = Math.round(node.x) + 'px';
      el.style.top = Math.round(node.y) + 'px';
      el.style.width = (node.w || 640) + 'px';
      el.style.height = (node.h || 400) + 'px';

      const fill = document.createElement('div');
      fill.className = 'frame-fill';
      el.appendChild(fill);

      const title = document.createElement('div');
      title.className = 'frame-title';
      title.textContent = node.text || 'Frame';
      title.title = 'Drag to move with its contents · double-click to rename';
      el.appendChild(title);

      title.addEventListener('mousedown', e => {
        if (e.button !== 0 || spacePressed) return;
        e.stopPropagation();
        if (title.isContentEditable) return;
        e.preventDefault();
        closeEdgePopover(); closeAddMenu(); closeAddPicker(); closeNodeMenu();
        if (connectMode) return;
        if (e.shiftKey) { toggleSelect(node.id); return; }
        if (!selectedIds.has(node.id)) selectNode(node.id);
        else selectedNodeId = node.id;
        // Move the selection plus everything inside any selected frame.
        const ids = new Set(selectedIds);
        db.nodes.filter(n => ids.has(n.id) && isFrame(n))
          .forEach(f => frameContents(f).forEach(n => ids.add(n.id)));
        const group = [...ids].map(id => {
          const n = db.nodes.find(x => x.id === id);
          const nEl = layer.querySelector(`.node[data-id="${id}"]`);
          return n && nEl ? { node: n, el: nEl, startX: n.x, startY: n.y } : null;
        }).filter(Boolean);
        isDraggingNode = true;
        dragState = {
          node, el, group,
          startX: node.x, startY: node.y,
          startMouseX: e.clientX, startMouseY: e.clientY,
          preSnapshot: snapshotBoard()
        };
      });
      title.addEventListener('click', e => e.stopPropagation());
      title.addEventListener('dblclick', e => { e.stopPropagation(); editFrameTitle(node.id); });
      title.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); title.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); title.textContent = node.text || 'Frame'; title.blur(); }
      });
      title.addEventListener('blur', () => {
        if (!title.isContentEditable) return;
        title.contentEditable = 'false';
        const v = title.textContent.trim() || 'Frame';
        title.textContent = v;
        if (v !== (node.text || 'Frame')) { pushHistory(); node.text = v; pulseSave(); }
      });
      title.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        const cx = e.clientX, cy = e.clientY;
        gateMenu(() => openNodeMenu(node.id, cx, cy));
      });

      const handle = document.createElement('div');
      handle.className = 'node-resize-handle';
      handle.title = 'Drag to resize';
      handle.addEventListener('mousedown', e => {
        e.stopPropagation(); e.preventDefault();
        selectNode(node.id);
        isResizingNode = true;
        resizeState = {
          node, el,
          startW: node.w || el.offsetWidth, startH: node.h || el.offsetHeight,
          startMouseX: e.clientX, startMouseY: e.clientY,
          preSnapshot: snapshotBoard()
        };
      });
      el.appendChild(handle);
      return el;
    }

    // ── Fade parked items (P129): on-hold/done projects, retired tools ──
    const PARKED_PROJECT = new Set(['onhold', 'done', 'archived']);

    function isParked(n) {
      if (!n.link) return false;
      try {
        if (n.kind === 'project') {
          const p = ((window.HubData ? HubData.getProjects() : []) || []).find(x => x.id === n.link.id);
          return !!p && PARKED_PROJECT.has(p.status);
        }
        if (n.kind === 'tool') {
          const raw = HubStorage.get('tool-portfolio-v1');
          const t = (Array.isArray(raw) ? raw : []).find(x => x.id === n.link.id);
          return !!t && t.status === 'retired';
        }
      } catch {}
      return false;
    }

    function applyParked() {
      const on = !!fullState.dimParked;
      layer.querySelectorAll('.node:not(.frame)').forEach(el => {
        const n = on ? db.nodes.find(x => x.id === el.dataset.id) : null;
        el.classList.toggle('parked', !!n && isParked(n));
      });
    }

    function setDimParked(on) {
      fullState.dimParked = !!on;
      applyParked();
      pulseSave();
    }

    // ── Focus mode (P128): one node + its direct connections stay bright ──

    function nodeLabel(n) {
      if (n.link && n.link.label) return n.link.label;
      const tmp = document.createElement('div');
      tmp.innerHTML = (n.text || '').replace(/<br\s*\/?>/gi, ' · ');
      return (tmp.textContent || '').trim() || '(empty note)';
    }

    function focusSet() {
      if (!focusId) return null;
      const set = new Set([focusId]);
      (db.edges || []).forEach(e => {
        if (e.from === focusId) set.add(e.to);
        if (e.to === focusId) set.add(e.from);
      });
      return set;
    }

    function applyFocus() {
      if (focusId && !db.nodes.some(n => n.id === focusId)) focusId = null;
      const set = focusSet();
      layer.querySelectorAll('.node:not(.frame)').forEach(el => {
        el.classList.toggle('dimmed', !!set && !set.has(el.dataset.id));
        el.classList.toggle('focus-center', el.dataset.id === focusId);
      });
      const help = document.getElementById('help-text');
      if (connectMode) return;
      if (focusId) {
        const n = db.nodes.find(x => x.id === focusId);
        help.textContent = `Focus: ${nodeLabel(n).slice(0, 40)} · ${set.size - 1} connected · Esc or click empty space to exit`;
      } else {
        help.textContent = DEFAULT_HELP;
      }
    }

    function setFocus(id) { focusId = id; renderEdges(); applyFocus(); }
    function clearFocus() { if (!focusId) return; focusId = null; renderEdges(); applyFocus(); }

    // ── Find (P128): Ctrl+F — this board first, then other boards ──
    let findResults = [], findActive = 0;

    function openFind() {
      const box = document.getElementById('find-box');
      const input = document.getElementById('find-input');
      box.style.display = 'flex';
      input.value = '';
      renderFind('');
      input.focus();
    }

    function closeFind() {
      document.getElementById('find-box').style.display = 'none';
    }

    function renderFind(q) {
      const list = document.getElementById('find-list');
      const query = q.trim().toLowerCase();
      list.innerHTML = '';
      findResults = []; findActive = 0;
      if (!query) { list.innerHTML = '<div class="find-empty">Type to find a node</div>'; return; }
      const boards = [db, ...fullState.boards.filter(b => b !== db)];
      boards.forEach((b, bi) => (b.nodes || []).forEach(n => {
        const label = nodeLabel(n);
        const low = label.toLowerCase();
        if (!low.includes(query)) return;
        // Rank: named cards first, then note titles, then note details
        const score = n.link ? 0 : (low.split(' · ')[0].includes(query) ? 1 : 2);
        findResults.push({ board: b, node: n, label, rank: (bi ? 10 : 0) + score });
      }));
      findResults.sort((a, b) => a.rank - b.rank);
      findResults = findResults.slice(0, 30);
      if (!findResults.length) { list.innerHTML = '<div class="find-empty">No match</div>'; return; }
      findResults.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'find-item' + (i === 0 ? ' active' : '');
        const icon = KIND_ICON[r.node.kind] || '📝';
        const where = r.board === db ? 'This board' : r.board.name;
        btn.innerHTML = `<span>${icon} ${HubUtils.esc(r.label.slice(0, 60))}</span><small>${HubUtils.esc(where)}</small>`;
        btn.onmousedown = e => { e.preventDefault(); e.stopPropagation(); goToFindResult(i); };
        list.appendChild(btn);
      });
    }

    function moveFindActive(d) {
      if (!findResults.length) return;
      findActive = (findActive + d + findResults.length) % findResults.length;
      document.querySelectorAll('#find-list .find-item').forEach((el, i) => {
        el.classList.toggle('active', i === findActive);
        if (i === findActive) el.scrollIntoView({ block: 'nearest' });
      });
    }

    function goToFindResult(i) {
      const r = findResults[i];
      if (!r) return;
      closeFind();
      if (r.board !== db) switchBoard(r.board.id);
      panToNode(r.node.id);
      selectNode(r.node.id);
    }

    // Centre a node in the viewport and flash it
    function panToNode(nodeId) {
      const node = db.nodes.find(n => n.id === nodeId);
      if (!node) return;
      const vw = viewport.offsetWidth, vh = viewport.offsetHeight;
      db.panX = vw / 2 - (node.x + (node.w || NODE_W) / 2) * db.zoom;
      db.panY = vh / 2 - (node.y + (node.h || NODE_H) / 2) * db.zoom;
      updateTransform();
      pulseSave();
      const el = document.querySelector(`.node[data-id="${nodeId}"]`);
      if (el) {
        el.style.transition = 'box-shadow 0.15s';
        el.style.boxShadow = '0 0 0 3px var(--accent)';
        setTimeout(() => { el.style.boxShadow = ''; }, 1800);
      }
    }

    document.getElementById('ep-label').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); closeEdgePopover(); }
      else if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        const edge = db.edges.find(x => x.id === _edgePopoverEdgeId);
        e.target.value = (edge && edge.label) || '';
        closeEdgePopover();
      }
    });

    document.getElementById('find-input').addEventListener('input', e => renderFind(e.target.value));
    document.getElementById('find-input').addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveFindActive(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveFindActive(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); goToFindResult(findActive); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFind(); }
    });

    function closeNodeMenu() {
      const menu = document.getElementById('node-menu');
      if (menu) menu.style.display = 'none';
    }

    // ── Render ───────────────────────────────────────────────

    function renderAll() {
      // Remove nodes but keep the SVG edge layer
      layer.querySelectorAll('.node').forEach(el => el.remove());
      const svgEl = document.getElementById('edges-svg');
      const area = n => (n.w || 0) * (n.h || 0);
      db.nodes.filter(isFrame).sort((a, b) => area(b) - area(a))
        .forEach(n => layer.insertBefore(buildFrameEl(n), svgEl));
      db.nodes.filter(n => !isFrame(n)).forEach(n => layer.appendChild(buildNodeEl(n)));
      renderLanes();
      renderEdges();
      renderMinimap();
      // A rebuild (e.g. a debounced pulseSave landing while the user is
      // mid-gesture) recreates node elements from scratch, which would
      // silently drop the in-progress Connect-mode source highlight even
      // though `connectSource` itself is untouched — making it look like
      // the click "did nothing". Reapply it to the rebuilt element.
      if (connectMode && connectSource) {
        const srcEl = layer.querySelector(`.node[data-id="${connectSource}"]`);
        if (srcEl) srcEl.classList.add('connect-source');
      }
      applyFocus();
      applyParked();
    }

    function rebuildActionBar(actions, node) {
      actions.innerHTML = '';
      const curKind = node.kind || 'note';

      // Kind toggle — Note / Goal / Project / R&D bet
      KINDS.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'na-btn' + (curKind === k.id ? ' active-color' : '');
        btn.title = k.title;
        btn.textContent = k.icon;
        btn.onmousedown = e => { e.stopPropagation(); setKind(node.id, k.id); };
        actions.appendChild(btn);
      });

      const kindSep = document.createElement('div');
      kindSep.className = 'na-sep';
      actions.appendChild(kindSep);

      // Color swatches — a Goal/Project node's color is fixed by its kind, so
      // the freeform color picker only applies to Note and R&D bet nodes.
      if (curKind === 'note' || curKind === 'rd') {
        COLORS.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'na-btn' + (node.color === c.id ? ' active-color' : '');
          btn.title = c.id.replace('c-', '');
          btn.innerHTML = `<div class="color-dot" style="background:${c.dot}"></div>`;
          btn.onmousedown = e => { e.stopPropagation(); setColor(node.id, c.id); };
          actions.appendChild(btn);
        });

        const sep = document.createElement('div');
        sep.className = 'na-sep';
        actions.appendChild(sep);
      }

      // Link button
      const linkBtn = document.createElement('button');
      linkBtn.className = 'na-btn hl-btn';
      linkBtn.innerHTML = '🔗';
      linkBtn.title = 'Link to hub items';
      linkBtn.onmousedown = e => {
        e.stopPropagation();
        const text = (node.text || 'Canvas Node').replace(/<[^>]*>/gm, '').slice(0, 30);
        HubLinks.openModal('canvas-hub', node.id, text);
      };
      actions.appendChild(linkBtn);

      // Reset size button (only shown when node has been resized)
      if (node.w || node.h) {
        const resetBtn = document.createElement('button');
        resetBtn.className = 'na-btn';
        resetBtn.innerHTML = '⊡';
        resetBtn.title = 'Reset to default size';
        resetBtn.onmousedown = e => {
          e.stopPropagation();
          delete node.w; delete node.h;
          const el = document.querySelector(`.node[data-id="${node.id}"]`);
          if (el) { el.style.width = ''; el.style.height = ''; }
          renderEdges(); renderMinimap(); pulseSave();
          rebuildActionBar(actions, node);
        };
        actions.appendChild(resetBtn);
      }

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.className = 'na-btn del';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Delete node';
      delBtn.onmousedown = e => { e.stopPropagation(); deleteNode(node.id); };
      actions.appendChild(delBtn);
    }

    const KIND_TOOL_LABEL = { project: 'Project Hub', goal: 'Goals Hub', tool: 'Tool Portfolio' };
    const KIND_PICK_LABEL = { project: '— pick a project —', goal: '— pick a goal —', tool: '— pick a tool —' };

    function buildKindStrip(node) {
      const items = liveItemsFor(node.kind);
      const wrap = document.createElement('div');
      wrap.className = 'node-kind-strip';

      // Icon + live name — always visible, this IS the node's content now
      // that Goal/Project/Tool nodes have no editable text body.
      const head = document.createElement('div');
      head.className = 'nk-head';
      const iconEl = document.createElement('span');
      iconEl.className = 'nk-icon';
      head.appendChild(iconEl);
      const nameEl = document.createElement('span');
      nameEl.className = 'nk-name';
      head.appendChild(nameEl);
      wrap.appendChild(head);

      // Select/open row — only shown once the node is selected (see
      // `.node.selected .nk-row` in CSS), so the resting card stays clean.
      const row = document.createElement('div');
      row.className = 'nk-row';

      const sel = document.createElement('select');
      sel.className = 'nk-select';
      sel.innerHTML = `<option value="">${KIND_PICK_LABEL[node.kind] || '— pick —'}</option>` +
        items.map(it => `<option value="${it.id}"${node.link && node.link.id === it.id ? ' selected' : ''}>${HubUtils.esc(it.label)}</option>`).join('');
      // Only swallow the click when NOT in Connect mode — otherwise a click
      // here (which covers most of a linked node's surface) never reaches
      // the outer node handler and Connect mode silently does nothing.
      sel.addEventListener('mousedown', e => { if (!connectMode) e.stopPropagation(); });
      sel.addEventListener('click', e => { if (!connectMode) e.stopPropagation(); });
      row.appendChild(sel);

      const openBtn = document.createElement('button');
      openBtn.className = 'nk-open';
      openBtn.textContent = '↗';
      openBtn.title = 'Open in ' + (KIND_TOOL_LABEL[node.kind] || 'source tool');
      openBtn.onmousedown = e => {
        if (connectMode) return; // let it bubble to the node's connect logic
        e.stopPropagation();
        if (node.link) HubLinks.navigateTo(node.link.tool, node.link.id);
      };
      row.appendChild(openBtn);

      wrap.appendChild(row);

      const status = document.createElement('div');
      status.className = 'nk-status';
      wrap.appendChild(status);

      function refresh() {
        const it = node.link ? items.find(i => i.id === node.link.id) : null;

        // Icon: the real favicon for a linked Tool, else the kind glyph.
        iconEl.innerHTML = '';
        if (node.kind === 'tool') {
          const fallback = (it && it.icon) || KIND_ICON.tool;
          const fav = faviconOrIcon(it && it.url, fallback, 24);
          if (fav.el) {
            fav.el.onerror = () => { iconEl.textContent = fallback; };
            iconEl.appendChild(fav.el);
          } else {
            iconEl.textContent = fallback;
          }
        } else {
          iconEl.textContent = KIND_ICON[node.kind];
        }

        if (it) {
          nameEl.textContent = it.label;
          nameEl.title = it.label;
          status.textContent = it.status;
          openBtn.style.display = '';
        } else {
          nameEl.textContent = node.link ? node.link.label : (KIND_PICK_LABEL[node.kind] || '— unlinked —');
          nameEl.title = nameEl.textContent;
          status.textContent = node.link ? '(item removed)' : '';
          openBtn.style.display = node.link ? '' : 'none';
        }
      }
      refresh();

      sel.addEventListener('change', () => {
        const it = items.find(i => i.id === sel.value);
        pushHistory();
        node.link = it ? { tool: toolLinkFor(node.kind), id: it.id, label: it.label } : null;
        pulseSave();
        refresh();
      });

      return wrap;
    }

    function buildNodeEl(node) {
      const el = document.createElement('div');
      el.className = `node ${node.color || 'c-gray'}${node.kind ? ' k-' + node.kind : ''}`;
      if (selectedIds.has(node.id)) el.classList.add(selectedIds.size > 1 ? 'in-selection' : 'selected');
      el.dataset.id = node.id;
      el.style.left = Math.round(node.x) + 'px';
      el.style.top = Math.round(node.y) + 'px';
      if (node.w) el.style.width = node.w + 'px';
      if (node.h) el.style.height = node.h + 'px';

      // Action bar
      const actions = document.createElement('div');
      actions.className = 'node-actions';
      rebuildActionBar(actions, node);
      el.appendChild(actions);

      // Colour header strip (purely decorative — reflects node colour class)
      const header = document.createElement('div');
      header.className = 'node-header';
      el.appendChild(header);

      // Kind badge — small role icon overlapping the top edge, for kinds
      // that DON'T get the full kind-strip below (currently just R&D bet;
      // Goal/Project/Tool show their icon inside the strip instead, larger
      // and next to the item's live name, so a second small copy here would
      // just be a duplicate).
      const isLinkedKind = node.kind === 'goal' || node.kind === 'project' || node.kind === 'tool';
      if (node.kind && KIND_ICON[node.kind] && !isLinkedKind) {
        const badge = document.createElement('div');
        badge.className = 'node-kind-badge';
        badge.title = KINDS.find(k => k.id === node.kind)?.title || node.kind;
        badge.textContent = KIND_ICON[node.kind];
        el.appendChild(badge);
      }

      // Kind strip — Goal/Project/Tool nodes get a live-link icon+name
      // display (select/open only shown once selected) and have NO
      // editable body at all: they're a display card for a real item, not
      // a free-text note.
      let body = null;
      if (isLinkedKind) {
        el.appendChild(buildKindStrip(node));
      } else {
        body = document.createElement('div');
        body.className = 'node-body';
        body.contentEditable = true;
        body.innerHTML = node.text || '';
        body.addEventListener('input', () => { node.text = body.innerHTML; pulseSave(); textEditDirty = true; });
        // One history entry per edit *session* (focus → blur), not per
        // keystroke — captured at focus time, only committed on blur if the
        // text actually changed, so clicking into and back out of a note
        // untouched doesn't leave a no-op undo entry.
        let editPreSnapshot = null, editBeforeValue = null;
        body.addEventListener('focus', () => {
          editPreSnapshot = snapshotBoard();
          editBeforeValue = node.text || '';
          textEditDirty = false;
        });
        body.addEventListener('blur', () => {
          if (editPreSnapshot && (node.text || '') !== editBeforeValue) commitGestureHistory(editPreSnapshot);
          editPreSnapshot = null; editBeforeValue = null;
          textEditDirty = false;
        });
        // Don't start a drag/text-select from the body — except in Connect
        // mode, where a click anywhere on the node (body included, since it
        // covers most of the node's surface) must reach the connect logic
        // below instead of being swallowed here.
        body.addEventListener('mousedown', e => { if (!connectMode && !e.shiftKey) e.stopPropagation(); });
        el.appendChild(body);
      }

      // Link badge
      const hlBadge = document.createElement('div');
      hlBadge.className = 'hl-badge-container';
      hlBadge.style.cssText = 'position:absolute;bottom:-10px;right:10px;';
      el.appendChild(hlBadge);

      function renderLinkBadge() {
        hlBadge.innerHTML = '';
        const links = HubLinks.getLinksFor('canvas-hub', node.id);
        if (!links.length) return;
        const badge = document.createElement('button');
        badge.className = 'hl-badge';
        badge.innerHTML = `🔗 ${links.length}`;
        badge.onclick = e => { e.stopPropagation(); HubLinks.showLinksPopover('canvas-hub', node.id, badge); };
        hlBadge.appendChild(badge);
      }
      renderLinkBadge();

      // Drag
      el.addEventListener('mousedown', e => {
        if (e.button !== 0 || spacePressed) return; // right-click is handled by contextmenu below
        if (e.target === body && !connectMode && !e.shiftKey) return; // let normal text-editing clicks through
        closeEdgePopover(); closeAddMenu(); closeAddPicker(); closeNodeMenu();
        if (connectMode) {
          // Connect mode: first click = source, second click = target.
          // preventDefault stops a click on the body from also placing a
          // text caret / stealing focus while we're just picking nodes.
          e.stopPropagation();
          e.preventDefault();
          if (!connectSource) {
            connectSource = node.id;
            el.classList.add('connect-source');
          } else if (connectSource !== node.id) {
            createEdge(connectSource, node.id);
            document.querySelectorAll('.node').forEach(n => n.classList.remove('connect-source'));
            connectSource = null;
          }
          return;
        }
        e.stopPropagation();
        if (e.shiftKey) {
          e.preventDefault(); // no text caret while picking nodes
          toggleSelect(node.id);
          return;
        }
        if (!selectedIds.has(node.id)) selectNode(node.id);
        else selectedNodeId = node.id;
        // Dragging any selected node moves the whole selection together.
        const group = [...selectedIds].map(id => {
          const n = db.nodes.find(x => x.id === id);
          const nEl = layer.querySelector(`.node[data-id="${id}"]`);
          return n && nEl ? { node: n, el: nEl, startX: n.x, startY: n.y } : null;
        }).filter(Boolean);
        isDraggingNode = true;
        dragState = {
          node, el, group,
          startX: node.x, startY: node.y,
          startMouseX: e.clientX, startMouseY: e.clientY,
          // Captured before any movement — only pushed to the undo stack at
          // drag-end, and only if the node actually moved. Otherwise a plain
          // click-to-select (mousedown+mouseup with zero movement) would
          // pollute history with a no-op entry.
          preSnapshot: snapshotBoard()
        };
      });

      el.addEventListener('click', e => {
        if (!connectMode) e.stopPropagation();
      });

      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        e.stopPropagation();
        const cx = e.clientX, cy = e.clientY;
        gateMenu(() => openNodeMenu(node.id, cx, cy));
      });

      // Double-click a Project / Goal / Tool card to open the real item
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        if (!isLinkedKind || !node.link || connectMode) return;
        if (e.target.closest('select')) return;
        HubLinks.navigateTo(node.link.tool, node.link.id);
      });

      // Resize handle
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'node-resize-handle';
      resizeHandle.title = 'Drag to resize';
      resizeHandle.addEventListener('mousedown', e => {
        e.stopPropagation();
        e.preventDefault();
        selectNode(node.id);
        isResizingNode = true;
        resizeState = {
          node, el,
          startW: node.w || el.offsetWidth,
          startH: node.h || el.offsetHeight,
          startMouseX: e.clientX,
          startMouseY: e.clientY,
          preSnapshot: snapshotBoard()
        };
      });
      el.appendChild(resizeHandle);

      // Link-change hook to refresh badge
      const prevHook = window.__hl_onLinkChange;
      window.__hl_onLinkChange = function () {
        if (prevHook) prevHook();
        renderLinkBadge();
      };

      return el;
    }

    // ── Layout (P127) ────────────────────────────────────────
    // Align / spread / arrange. Acts on the selected nodes; Tidy grid and
    // By type fall back to the whole board when fewer than 2 are selected.
    // Every action is one undo step.

    const GRID = 20;          // matches the background dot grid
    const LAYOUT_GAP = 40;    // space between nodes in Tidy grid / By type
    const snap = v => Math.round(v / GRID) * GRID;
    let suppressNextClick = false;
    let marquee = null;

    // Real rendered size — most nodes have no stored w/h.
    function nodeBox(n) {
      const el = layer.querySelector(`.node[data-id="${n.id}"]`);
      return {
        n,
        w: n.w || (el ? el.offsetWidth : NODE_W),
        h: n.h || (el ? el.offsetHeight : NODE_H),
      };
    }

    function selectedBoxes() {
      return db.nodes.filter(n => selectedIds.has(n.id) && !isFrame(n)).map(nodeBox);
    }

    function layoutTargets() {
      const sel = selectedBoxes();
      return sel.length >= 2 ? sel : db.nodes.filter(n => !isFrame(n)).map(nodeBox);
    }

    function commitLayout(boxes, placeAll) {
      if (!boxes.length) return;
      pushHistory();
      placeAll(boxes);
      if (fullState.snapToGrid) boxes.forEach(b => { b.n.x = snap(b.n.x); b.n.y = snap(b.n.y); });
      renderAll();
      pulseSave();
    }

    function alignNodes(side) {
      const boxes = selectedBoxes();
      if (boxes.length < 2) return;
      const L = Math.min(...boxes.map(b => b.n.x)), R = Math.max(...boxes.map(b => b.n.x + b.w));
      const T = Math.min(...boxes.map(b => b.n.y)), B = Math.max(...boxes.map(b => b.n.y + b.h));
      commitLayout(boxes, bs => bs.forEach(b => {
        if (side === 'left') b.n.x = L;
        if (side === 'right') b.n.x = R - b.w;
        if (side === 'center') b.n.x = (L + R) / 2 - b.w / 2;
        if (side === 'top') b.n.y = T;
        if (side === 'bottom') b.n.y = B - b.h;
        if (side === 'middle') b.n.y = (T + B) / 2 - b.h / 2;
      }));
    }

    // Equal gaps between neighbours; the first and last node stay put.
    function distributeNodes(axis) {
      const boxes = selectedBoxes();
      if (boxes.length < 3) return;
      const size = axis === 'x' ? 'w' : 'h';
      boxes.sort((a, b) => a.n[axis] - b.n[axis]);
      const first = boxes[0], last = boxes[boxes.length - 1];
      const span = last.n[axis] + last[size] - first.n[axis];
      const used = boxes.reduce((s, b) => s + b[size], 0);
      const gap = (span - used) / (boxes.length - 1);
      let pos = first.n[axis];
      commitLayout(boxes, bs => bs.forEach(b => { b.n[axis] = pos; pos += b[size] + gap; }));
    }

    // Keep the current reading order: group into rows by position, then
    // left to right inside each row.
    function readingOrder(boxes) {
      const byY = boxes.slice().sort((a, b) => a.n.y - b.n.y);
      const rows = [];
      byY.forEach(b => {
        const row = rows[rows.length - 1];
        if (row && b.n.y - row[0].n.y < row[0].h / 2) row.push(b); else rows.push([b]);
      });
      return rows.flatMap(r => r.sort((a, b) => a.n.x - b.n.x));
    }

    function placeGrid(boxes, x0, y0, cols) {
      const cw = Math.max(...boxes.map(b => b.w)) + LAYOUT_GAP;
      const ch = Math.max(...boxes.map(b => b.h)) + LAYOUT_GAP;
      boxes.forEach((b, i) => {
        b.n.x = x0 + (i % cols) * cw;
        b.n.y = y0 + Math.floor(i / cols) * ch;
      });
      return Math.ceil(boxes.length / cols) * ch;
    }

    function tidyGrid() {
      const boxes = readingOrder(layoutTargets());
      if (!boxes.length) return;
      const x0 = snap(Math.min(...boxes.map(b => b.n.x)));
      const y0 = snap(Math.min(...boxes.map(b => b.n.y)));
      const cols = Math.max(1, Math.ceil(Math.sqrt(boxes.length * 1.5)));
      commitLayout(boxes, bs => placeGrid(bs, x0, y0, cols));
    }

    // One block of rows per node type, in KINDS order, A–Z inside each.
    function arrangeByType() {
      const boxes = layoutTargets();
      if (!boxes.length) return;
      const x0 = snap(Math.min(...boxes.map(b => b.n.x)));
      let y = snap(Math.min(...boxes.map(b => b.n.y)));
      const name = b => ((b.n.link && b.n.link.label) || b.n.text || '').toLowerCase();
      commitLayout(boxes, bs => KINDS.forEach(k => {
        const group = bs.filter(b => (b.n.kind || 'note') === k.id)
          .sort((a, b) => name(a).localeCompare(name(b)));
        if (group.length) y += placeGrid(group, x0, y, 6) + LAYOUT_GAP;
      }));
    }

    // Zoom and pan so every node on the board is in view.
    function fitToScreen() {
      const boxes = db.nodes.map(nodeBox);
      if (!boxes.length) { resetView(); return; }
      const pad = 60;
      const L = Math.min(...boxes.map(b => b.n.x)), R = Math.max(...boxes.map(b => b.n.x + b.w));
      const T = Math.min(...boxes.map(b => b.n.y)), B = Math.max(...boxes.map(b => b.n.y + b.h));
      const vw = viewport.offsetWidth, vh = viewport.offsetHeight;
      db.zoom = Math.min(1, Math.max(0.15, Math.min((vw - pad * 2) / (R - L), (vh - pad * 2) / (B - T))));
      db.panX = vw / 2 - ((L + R) / 2) * db.zoom;
      db.panY = vh / 2 - ((T + B) / 2) * db.zoom;
      updateTransform(); pulseSave();
    }

    function setSnap(on) {
      fullState.snapToGrid = !!on;
      pulseSave();
    }

    function refreshLayoutMenu() {
      const menu = document.getElementById('layout-menu');
      if (!menu) return;
      const n = selectedIds.size;
      menu.querySelectorAll('button[data-need]').forEach(b => {
        b.disabled = n < Number(b.dataset.need);
      });
      document.getElementById('lm-snap').checked = !!fullState.snapToGrid;
      document.getElementById('lm-parked').checked = !!fullState.dimParked;
      document.getElementById('lm-hint').textContent = n >= 2
        ? `${n} nodes selected.`
        : 'Shift+click or Shift+drag to select nodes. Arrange works on all nodes.';
    }

    function toggleLayoutMenu() {
      const menu = document.getElementById('layout-menu');
      if (menu.style.display === 'flex') { closeLayoutMenu(); return; }
      refreshLayoutMenu();
      menu.style.display = 'flex';
      const r = document.getElementById('layout-btn').getBoundingClientRect();
      menu.style.left = r.left + 'px';
      menu.style.top = Math.max(8, r.top - menu.offsetHeight - 8) + 'px';
      document.getElementById('layout-btn').classList.add('active');
    }

    function closeLayoutMenu() {
      document.getElementById('layout-menu').style.display = 'none';
      document.getElementById('layout-btn')?.classList.remove('active');
    }

    // Marquee: drag on empty canvas selects the boxed nodes; Shift adds to the selection.
    function startMarquee(e) {
      marquee = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY, add: e.shiftKey };
    }
    function moveMarquee(e) {
      marquee.x1 = e.clientX; marquee.y1 = e.clientY;
      if (Math.abs(marquee.x1 - marquee.x0) < PAN_THRESHOLD && Math.abs(marquee.y1 - marquee.y0) < PAN_THRESHOLD) return;
      drawMarquee();
    }
    function drawMarquee() {
      const el = document.getElementById('marquee');
      el.style.display = 'block';
      el.style.left = Math.min(marquee.x0, marquee.x1) + 'px';
      el.style.top = Math.min(marquee.y0, marquee.y1) + 'px';
      el.style.width = Math.abs(marquee.x1 - marquee.x0) + 'px';
      el.style.height = Math.abs(marquee.y1 - marquee.y0) + 'px';
    }
    function endMarquee() {
      const L = Math.min(marquee.x0, marquee.x1), R = Math.max(marquee.x0, marquee.x1);
      const T = Math.min(marquee.y0, marquee.y1), B = Math.max(marquee.y0, marquee.y1);
      const add = marquee.add;
      document.getElementById('marquee').style.display = 'none';
      marquee = null;
      // A press without a drag is a plain click: let the click handler
      // deselect / cancel as before.
      if (R - L < PAN_THRESHOLD && B - T < PAN_THRESHOLD) return;
      suppressNextClick = true;
      if (!add) { selectedIds = new Set(); selectedNodeId = null; }
      layer.querySelectorAll('.node').forEach(el => {
        const r = el.getBoundingClientRect();
        const hit = el.classList.contains('frame')
          ? (r.left >= L && r.right <= R && r.top >= T && r.bottom <= B)
          : (r.right > L && r.left < R && r.bottom > T && r.top < B);
        if (hit) selectedIds.add(el.dataset.id);
      });
      selectedNodeId = [...selectedIds].pop() || null;
      applySelectionClasses();
    }

    // ── Mini-map ─────────────────────────────────────────────

    function renderMinimap() {
      const container = document.getElementById('minimap');
      const canvas = document.getElementById('minimap-canvas');
      if (!canvas || !db.nodes.length) { container.style.display = 'none'; return; }
      container.style.display = '';

      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#18181c';
      ctx.fillRect(0, 0, W, H);

      const pad = 50;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      db.nodes.forEach(n => {
        minX = Math.min(minX, n.x - pad);
        minY = Math.min(minY, n.y - pad);
        maxX = Math.max(maxX, n.x + (n.w || NODE_W) + pad);
        maxY = Math.max(maxY, n.y + (n.h || NODE_H) + pad);
      });

      const scale = Math.min(W / (maxX - minX), H / (maxY - minY));
      const toMM = (cx, cy) => [(cx - minX) * scale, (cy - minY) * scale];

      const _css = getComputedStyle(document.documentElement);
      (db.lanes || []).forEach(l => {
        ctx.fillStyle = _css.getPropertyValue('--node-' + (l.color || 'c-gray').slice(2)).trim() || _css.getPropertyValue('--surface2').trim();
        ctx.globalAlpha = 0.5;
        if (l.axis === 'col') ctx.fillRect((l.start - minX) * scale, 0, l.size * scale, H);
        else ctx.fillRect(0, (l.start - minY) * scale, W, l.size * scale);
        ctx.globalAlpha = 1;
      });

      // Edges
      const _accent = _css.getPropertyValue('--accent').trim() || '#b8f033';
      const _accentGlow = _css.getPropertyValue('--accent-glow').trim() || 'rgba(184,240,51,0.25)';
      const _border2 = _css.getPropertyValue('--border2').trim() || 'rgba(255,255,255,0.15)';
      const _text2 = _css.getPropertyValue('--text2').trim() || 'rgba(255,255,255,0.4)';
      if (db.edges && db.edges.length) {
        ctx.strokeStyle = _accentGlow;
        ctx.lineWidth = 0.8;
        db.edges.forEach(edge => {
          const f = db.nodes.find(n => n.id === edge.from);
          const t = db.nodes.find(n => n.id === edge.to);
          if (!f || !t) return;
          const [fx, fy] = toMM(f.x + (f.w || NODE_W) / 2, f.y + (f.h || NODE_H) / 2);
          const [tx, ty] = toMM(t.x + (t.w || NODE_W) / 2, t.y + (t.h || NODE_H) / 2);
          ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
        });
      }

      // Nodes — fills read the theme-aware --node-* tokens (correct in dark/light/ink)
      const nodeFill = (cls) => _css.getPropertyValue('--node-' + (cls || 'c-gray').slice(2)).trim()
        || _css.getPropertyValue('--node-gray').trim() || '#2a2a30';
      db.nodes.filter(isFrame).forEach(n => {
        const [mx, my] = toMM(n.x, n.y);
        ctx.strokeStyle = selectedIds.has(n.id) ? _accent : _text2;
        ctx.lineWidth = 0.8;
        ctx.strokeRect(mx, my, (n.w || NODE_W) * scale, (n.h || NODE_H) * scale);
      });
      db.nodes.filter(n => !isFrame(n)).forEach(n => {
        const [mx, my] = toMM(n.x, n.y);
        const nw = Math.max((n.w || NODE_W) * scale, 3);
        const nh = Math.max((n.h || NODE_H) * scale, 3);
        ctx.fillStyle = nodeFill(n.color);
        ctx.fillRect(mx, my, nw, nh);
        ctx.strokeStyle = selectedIds.has(n.id) ? _accent : _border2;
        ctx.lineWidth = selectedIds.has(n.id) ? 1.2 : 0.5;
        ctx.strokeRect(mx, my, nw, nh);
      });

      // Viewport rectangle
      const vpW = viewport.offsetWidth, vpH = viewport.offsetHeight;
      const vx = -db.panX / db.zoom, vy = -db.panY / db.zoom;
      const vw = vpW / db.zoom, vh = vpH / db.zoom;
      const [mmx, mmy] = toMM(vx, vy);
      ctx.strokeStyle = _text2;
      ctx.lineWidth = 1;
      ctx.strokeRect(mmx, mmy, vw * scale, vh * scale);
    }

    // ── PNG Export ───────────────────────────────────────────

    function exportPNG() {
      const btn = document.querySelector('[onclick="exportPNG()"]');
      btn.textContent = 'Exporting…';
      btn.disabled = true;

      html2canvas(viewport, {
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#111',
        scale: window.devicePixelRatio || 1,
        logging: false,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `canvas-${HubUtils.todayLocal()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).finally(() => {
        btn.textContent = 'Export PNG';
        btn.disabled = false;
      });
    }

    // ── Hub Search resolver ──────────────────────────────────

    HubLinks.resolveItems = (function (old) {
      return function (toolId) {
        if (toolId === 'canvas-hub') {
          const state = migrateShape(HubStorage.get(STORAGE_KEY));
          const multi = state.boards.length > 1;
          const items = [];
          state.boards.forEach(b => (b.nodes || []).forEach(n => {
            items.push({
              id: n.id,
              label: (n.link && n.link.label) || (n.text || '').replace(/<[^>]*>/gm, '').slice(0, 50) || '(empty node)',
              subtitle: (multi ? b.name + ' · ' : '') + (n.kind === 'goal' ? '🎯 Goal' : n.kind === 'project' ? '📌 Project' : n.kind === 'tool' ? '🛠 Tool' : n.kind === 'rd' ? '🧪 R&D bet' : 'canvas note')
            });
          }));
          return items;
        }
        return old(toolId);
      };
    })(HubLinks.resolveItems);

    // ── Init ─────────────────────────────────────────────────
    window.addEventListener('resize', positionLanes);

    updateTransform();
    renderAll();
    renderBoardBar();
    updateUndoRedoButtons();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HubBootstrap.start('canvas-hub');
    });

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      if (e.data?.type === 'hub-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        renderMinimap();
        return;
      }
      if (!e.data || e.data.type !== 'hub-highlight') return;
      const nodeId = e.data.itemId;
      if (!nodeId) return;
      let node = db.nodes.find(n => n.id === nodeId);
      if (!node) {
        // Not on the active board — find it on another board and switch first
        const owner = fullState.boards.find(b => (b.nodes || []).some(n => n.id === nodeId));
        if (owner && owner.id !== db.id) {
          switchBoard(owner.id);
          node = db.nodes.find(n => n.id === nodeId);
        }
      }
      if (!node) return;

      panToNode(nodeId);
    });
  </script>
</body>
