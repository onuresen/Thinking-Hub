<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; font-src 'self'; connect-src 'self' https://api.anthropic.com; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule</title>
  <script src="hub-storage.js"></script>
  <script src="hub-utils.js"></script>
  <script src="hub-links.js"></script>
  <script src="hub-data.js"></script>
  <script src="hub-bootstrap.js"></script>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles/schedule.css">
</head>

<body>
  <!-- ══ Main ═════════════════════════════════════════════════════ -->
  <main class="sch-main">
    <div class="sch-toolbar">
      <div class="sch-logo-mark">▦</div>
      <span class="sch-logo-text">Schedule</span>
      <div class="sch-toolbar-sep"></div>
      <div class="sch-view-toggle">
        <button class="sch-view-btn active" id="btn-calendar" onclick="switchView('calendar')">Calendar</button>
        <button class="sch-view-btn" id="btn-timeline" onclick="switchView('timeline')">Timeline</button>
      </div>
      <div style="flex:1"></div>
      <button class="sch-add-btn" onclick="openDrawer(null)">+ Add Item</button>
    </div>

    <div class="sch-view-host">

      <!-- Timeline: projects with their milestones, tasks, meetings and items -->
      <div id="view-timeline" class="view-hidden">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="multiNav(-1)" aria-label="Earlier">&#8249;</button>
          <span class="cal-nav-title" id="multi-range-label"></span>
          <button class="cal-nav-btn" onclick="multiNav(1)" aria-label="Later">&#8250;</button>
          <div class="tl-legend" aria-hidden="true">
            <span><i class="lg-ms"></i>Milestone</span><span><i class="lg-task"></i>Task due</span>
            <span><i class="lg-meet"></i>Meeting</span><span><i class="lg-item"></i>Item</span>
          </div>
          <div class="sch-toolbar-sep"></div>
          <div class="sch-seg" role="group" aria-label="Zoom">
            <button id="tl-zoom-week" onclick="setMultiZoom('week')">Weeks</button>
            <button id="tl-zoom-month" onclick="setMultiZoom('month')">Months</button>
          </div>
          <button class="sch-toolbar-today" onclick="multiToday()">Today</button>
        </div>
        <div class="multi-gantt-scroll" id="multi-gantt-scroll"></div>
      </div>

      <!-- Calendar -->
      <div id="view-calendar">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calNav(-1)">&#8249;</button>
          <span class="cal-nav-title" id="cal-title"></span>
          <button class="cal-nav-btn" onclick="calNav(1)">&#8250;</button>
          <div class="sch-toolbar-sep"></div>
          <div class="sch-seg" role="group" aria-label="Calendar range">
            <button id="cal-month-btn" onclick="setCalMode(false)">Month</button>
            <button id="cal-week-btn" onclick="setCalMode(true)">Week</button>
          </div>
          <button class="sch-toolbar-today" onclick="calToday()">Today</button>
        </div>
        <div class="cal-week-header" id="cal-week-header">
          <div class="cal-week-gutter" id="cwl-gutter" style="display:none"></div>
          <div class="cal-week-label" id="cwl-0">Mon</div>
          <div class="cal-week-label" id="cwl-1">Tue</div>
          <div class="cal-week-label" id="cwl-2">Wed</div>
          <div class="cal-week-label" id="cwl-3">Thu</div>
          <div class="cal-week-label" id="cwl-4">Fri</div>
          <div class="cal-week-label weekend" id="cwl-5">Sat</div>
          <div class="cal-week-label weekend" id="cwl-6">Sun</div>
        </div>
        <div class="cal-grid-wrap">
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- ══ Edit Drawer ═══════════════════════════════════════════════ -->
  <div class="sch-drawer" id="sch-drawer">
    <div class="sch-drawer-header">
      <span class="sch-drawer-title" id="drawer-title">Add Item</span>
      <button class="sch-close-btn" onclick="closeDrawer()">&#10005;</button>
    </div>
    <div class="sch-drawer-body">
      <div id="drawer-badge" style="display:none">
        <div class="sch-source-badge">Imported from Projects — edit the source there to update the origin.</div>
      </div>
      <div class="sch-field">
        <label class="sch-label">Title</label>
        <input class="sch-input" id="f-title" type="text" placeholder="Item title…" />
      </div>
      <div class="sch-field">
        <label class="sch-label">Type</label>
        <select class="sch-select" id="f-type">
          <option value="task">Task</option>
          <option value="milestone">Milestone</option>
          <option value="event">Event</option>
        </select>
      </div>
      <div class="sch-date-row">
        <div class="sch-field">
          <label class="sch-label">Start</label>
          <input class="sch-input" id="f-start" type="date" />
        </div>
        <div class="sch-field">
          <label class="sch-label">End</label>
          <input class="sch-input" id="f-end" type="date" />
        </div>
      </div>
      <div class="sch-date-row">
        <div class="sch-field">
          <label class="sch-label">Start time <span style="opacity:.6">(optional)</span></label>
          <input class="sch-input" id="f-start-time" type="time" step="1800" />
        </div>
        <div class="sch-field">
          <label class="sch-label">End time</label>
          <input class="sch-input" id="f-end-time" type="time" step="1800" />
        </div>
      </div>
      <div class="sch-field">
        <label class="sch-label">Color</label>
        <div class="sch-color-row" id="color-swatches"></div>
      </div>
      <div class="sch-field">
        <label class="sch-label">Project</label>
        <select class="sch-input" id="f-project">
          <option value="">— none —</option>
        </select>
      </div>
      <div class="sch-field">
        <label class="sch-label">Notes</label>
        <textarea class="sch-textarea" id="f-notes" placeholder="Optional notes…"></textarea>
      </div>
      <div class="sch-done-row">
        <input type="checkbox" id="f-done" />
        <label for="f-done">Mark as done</label>
      </div>
    </div>
    <div class="sch-drawer-footer">
      <button class="sch-save-btn" onclick="saveDrawer()">Save</button>
      <button class="sch-delete-btn" id="drawer-delete-btn" onclick="deleteCurrentItem()"
        style="display:none">Delete</button>
    </div>
  </div>

  <!-- ══ Meeting panel (P164): look at a meeting without leaving Schedule ══ -->
  <div class="sch-drawer" id="sch-meeting-drawer" role="dialog" aria-labelledby="mp-title">
    <div class="sch-drawer-header">
      <span class="sch-drawer-title" id="mp-title">Meeting</span>
      <button class="sch-close-btn" onclick="closeMeetingPanel()" aria-label="Close">&#10005;</button>
    </div>
    <div class="sch-drawer-body" id="mp-body"></div>
    <div class="sch-drawer-footer">
      <button class="sch-save-btn" onclick="saveMeetingPanel()">Save</button>
      <button class="sch-secondary-btn" onclick="openMeetingInHub()">Open in Meetings</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="sch-toast" id="sch-toast"></div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // Date utilities (declared first so TODAY const can use them)
    // ═══════════════════════════════════════════════════════════════

    const SOURCE_TYPES = {
      manual: "Manual",
      project: "Project Task",
      alignment: "Alignment Decision",
      kmqt: "KMQT Try",
      decision: "Decision Log"
    };

    function isoToDate(s) {
      return s ? new Date(s + 'T00:00:00') : new Date();
    }

    function dateToIso(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function addDays(iso, n) {
      const d = isoToDate(iso);
      d.setDate(d.getDate() + n);
      return dateToIso(d);
    }

    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      mins = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    function addMinutesToTime(t, delta) {
      return minutesToTime(timeToMinutes(t) + delta);
    }

    function getWeekStart(iso) {
      const d = isoToDate(iso);
      const dow = d.getDay(); // 0=Sun
      d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
      return dateToIso(d);
    }

    function getDow(iso) {
      // 0=Mon … 6=Sun
      const d = isoToDate(iso).getDay();
      return d === 0 ? 6 : d - 1;
    }

    function isWeekend(iso) {
      const d = getDow(iso);
      return d === 5 || d === 6;
    }

    function fmtDate(iso) {
      if (!iso) return '';
      return isoToDate(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function fmtMonth(year, month) {
      return new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function uid() { return 'si-' + Math.random().toString(36).slice(2, 9); }

    function esc(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ═══════════════════════════════════════════════════════════════
    // Constants
    // ═══════════════════════════════════════════════════════════════
    const STORAGE_KEY = 'schedule-v1';
    const TODAY = dateToIso(new Date());

    const PALETTE = [
      '#b8f033', '#4ade80', '#60a5fa', '#f472b6',
      '#fb923c', '#a78bfa', '#facc15', '#34d399',
      '#f87171', '#94a3b8',
    ];

    const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // Day-level status tags — a day is "out of office", not one more timed
    // item. Reuses the app's existing node/border token pairs (P41's colored
    // card-variant convention) rather than inventing new colors.
    const DAY_TAGS = {
      oof:     { icon: '🏠', label: 'Out of Office',   bg: 'var(--node-blue)',   fg: 'var(--border-blue)' },
      trip:    { icon: '✈️', label: 'Business Trip',   bg: 'var(--node-purple)', fg: 'var(--border-purple)' },
      telework:{ icon: '💻', label: 'Telework',        bg: 'var(--node-yellow)', fg: 'var(--border-yellow)' },
      seminar: { icon: '🎤', label: 'Seminar',         bg: 'var(--node-purple)', fg: 'var(--border-purple)' },
      training:{ icon: '🎓', label: 'Training',        bg: 'var(--node-gray)',   fg: 'var(--border-gray)' },
      holiday: { icon: '🎌', label: 'Public Holiday',  bg: 'var(--node-red)',    fg: 'var(--border-red)' },
      off:     { icon: '🌴', label: 'Day Off',         bg: 'var(--node-green)',  fg: 'var(--border-green)' },
    };

    // Week-grid layout constants
    const WG_START_MIN = 6 * 60;   // 06:00
    const WG_END_MIN = 22 * 60;    // 22:00
    const WG_SLOT_MIN = 30;        // 30-minute slots
    const WG_SLOT_PX = 24;         // px per slot
    const WG_PX_PER_MIN = WG_SLOT_PX / WG_SLOT_MIN;
    const WORK_PERIODS = [['08:30', '12:00'], ['13:00', '17:30']];

    // Greedy lane assignment for overlapping blocks. Mutates each block
    // with a `.lane` index and returns the total lane count.
    function layoutLanes(blocks) {
      blocks.sort((a, b) => a.startMin - b.startMin);
      const laneEnds = [];
      blocks.forEach(b => {
        let lane = laneEnds.findIndex(end => end <= b.startMin);
        if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = b.endMin;
        b.lane = lane;
      });
      return Math.max(1, laneEnds.length);
    }

    // ═══════════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════════
    let state;
    let ui = {
      activeView: 'calendar',
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      calWeekMode: false,
      calWeekStart: getWeekStart(TODAY),
      selectedId: null,
      drawerItemId: null,
      multiZoom: 'week',
      multiOffset: 0,
      collapsedProjects: new Set(),
    };
    let _drawerColor = PALETTE[2];

    // ═══════════════════════════════════════════════════════════════
    // Persistence
    // ═══════════════════════════════════════════════════════════════
    function loadState() {
      try {
        const saved = HubStorage.get(STORAGE_KEY);
        if (saved) {
          if (!saved.dayTags) saved.dayTags = {};
          return saved;
        }
      } catch { }
      return { items: [], settings: { defaultZoom: 'month', defaultView: 'timeline' }, dayTags: {} };
    }

    function saveState() {
      HubStorage.set(STORAGE_KEY, state);
    }

    // ═══════════════════════════════════════════════════════════════
    // Filtered items
    // ═══════════════════════════════════════════════════════════════
    // Schedule's own items. Hides old copies made by the Meetings tool's retired
    // "→ Schedule" button while that meeting still exists: Schedule already
    // draws every meeting, so the copy showed twice.
    function filteredItems() {
      const copies = meetingCopyIds();
      return state.items.filter(it => !copies.has(it.id));
    }

    function meetingCopyIds() {
      const ids = new Set();
      (_readMeetings().meetings || []).forEach(m => { if (m.scheduleEventId) ids.add(m.scheduleEventId); });
      return ids;
    }

    // Project id → color, for meeting pills and timeline rows.
    function projectColors() {
      const map = {};
      try { HubData.getProjects().forEach(p => { if (p.color) map[p.id] = p.color; }); } catch { }
      return map;
    }

    // ═══════════════════════════════════════════════════════════════
    // Calendar
    // ═══════════════════════════════════════════════════════════════
    function renderCalendar() {
      document.getElementById('cal-month-btn').classList.toggle('active', !ui.calWeekMode);
      document.getElementById('cal-week-btn').classList.toggle('active', ui.calWeekMode);
      if (ui.calWeekMode) renderCalWeek();
      else renderCalMonth();
    }

    function getMeetingsByDate() {
      let meetingsData = {};
      try { meetingsData = JSON.parse(localStorage.getItem('meetings-hub-v1') || '{}'); } catch { }
      const byDate = {};
      (meetingsData.meetings || []).forEach(m => {
        if (m.archived) return;
        if (m.recurring) {
          // One pill per occurrence date, sharing the series id (used by drag/resize + click-to-open).
          (m.occurrenceDates || []).forEach(occ => {
            const pillM = { ...m, date: occ.date, time: occ.time, durationMins: occ.durationMins };
            (byDate[occ.date] = byDate[occ.date] || []).push(pillM);
          });
          return;
        }
        if (!m.date) return;
        (byDate[m.date] = byDate[m.date] || []).push(m);
      });
      return byDate;
    }

    // Meetings carry their project's color on the left edge, and their time.
    function meetingStyle(m, colors) {
      const c = m.projectId && colors ? colors[m.projectId] : '';
      return c ? ` style="--mc:${esc(c)}"` : '';
    }

    function meetingPillHtml(m, colors) {
      const icon = m.recurring ? '🔁' : '';
      return `<span class="cal-pill meeting${m.date < TODAY ? ' past' : ''}"${meetingStyle(m, colors || projectColors())}
        onclick="event.stopPropagation(); openMeetingPanel('${m.id}', '${m.date}')"
        title="${esc((m.time ? m.time + ' · ' : '') + (m.title || 'Meeting'))}">${m.time ? `<b class="pill-time">${esc(m.time)}</b>` : ''}${icon ? icon + ' ' : ''}${esc(m.title || 'Meeting')}</span>`;
    }

    function renderCalMonth() {
      const { calYear: year, calMonth: month } = ui;
      document.getElementById('cal-title').textContent = fmtMonth(year, month);
      const items = filteredItems();
      const meetingsByDate = getMeetingsByDate();
      const colors = projectColors();

      const firstDay = new Date(year, month, 1);
      const firstDow = firstDay.getDay();
      const daysBack = firstDow === 0 ? 6 : firstDow - 1;

      const gridStart = new Date(firstDay);
      gridStart.setDate(gridStart.getDate() - daysBack);

      const lastDay = new Date(year, month + 1, 0);
      const lastDow = lastDay.getDay();
      const daysForward = lastDow === 0 ? 0 : 7 - lastDow;

      const gridEnd = new Date(lastDay);
      gridEnd.setDate(gridEnd.getDate() + daysForward);

      const days = [];
      const cur = new Date(gridStart);
      while (cur <= gridEnd) { days.push(dateToIso(cur)); cur.setDate(cur.getDate() + 1); }

      // Reset week-mode artifacts in case we're switching back from week view
      const header = document.getElementById('cal-week-header');
      header.classList.remove('week-mode');
      document.getElementById('cwl-gutter').style.display = 'none';
      const monthLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      for (let i = 0; i < 7; i++) {
        const lbl = document.getElementById('cwl-' + i);
        lbl.textContent = monthLabels[i];
        lbl.classList.remove('today');
      }
      const grid = document.getElementById('cal-grid');
      grid.classList.remove('week-grid');
      grid.style.removeProperty('--wg-grid-height');
      grid.style.removeProperty('--wg-slot-height');

      grid.style.setProperty('--cal-rows', days.length / 7);

      document.getElementById('cal-grid').innerHTML = days.map(iso => {
        const d = isoToDate(iso);
        const isThisMonth = d.getMonth() === month;
        const isToday = iso === TODAY;
        const isWE = isWeekend(iso);

        const dayMeetings = (meetingsByDate[iso] || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        const dayItems = items.filter(it => it.start <= iso && iso <= it.end);
        const total = dayMeetings.length + dayItems.length;
        const shownLimit = 4;
        const shownMeetings = dayMeetings.slice(0, shownLimit);
        const meetingPills = shownMeetings.map(m => meetingPillHtml(m, colors)).join('');
        const remaining = shownLimit - shownMeetings.length;
        const shownItems = remaining > 0 ? dayItems.slice(0, remaining) : [];
        const overflow = total - shownMeetings.length - shownItems.length;

        const pills = shownItems.map(it => {
          const bg = it.color + '28';
          const bd = it.color + '88';
          const cont = it.start !== it.end && it.end > iso ? ' →' : '';
          return `<span class="cal-pill${it.done ? ' done' : ''}"
        style="background:${bg}; border:1px solid ${bd}; color:${it.color}"
        onclick="event.stopPropagation(); selectAndEdit('${it.id}')"
        title="${esc(it.title)}">${esc(it.title || '')}${cont}</span>`;
        }).join('');

        const dayTag = (state.dayTags || {})[iso];
        const tagDef = dayTag ? DAY_TAGS[dayTag] : null;
        const cellStyle = tagDef ? ` style="background:${tagDef.bg}"` : '';

        return `<div class="cal-day-cell${isToday ? ' today' : ''}${!isThisMonth ? ' out-of-month' : ''}${isWE ? ' weekend' : ''}"${cellStyle}
      onclick="openDrawer(null, '${iso}')">
      <div class="cal-day-head">
        <div class="cal-day-num">${d.getDate()}</div>
        <div class="cal-day-tag${tagDef ? '' : ' cal-day-tag-empty'}"${tagDef ? ` style="color:${tagDef.fg}" title="${esc(tagDef.label)}"` : ' title="Tag this day"'}
          onclick="event.stopPropagation(); openDayTagPicker(event,'${iso}')">${tagDef ? tagDef.icon : '+'}</div>
      </div>
      ${meetingPills}
      ${pills}
      ${overflow > 0 ? `<span class="cal-more">+${overflow} more</span>` : ''}
    </div>`;
      }).join('');
    }

    // ── Day-tag picker (Out of Office / Business Trip / Telework / Seminar / Training / Public Holiday / Day Off) ──
    let _dayTagPopover = null;

    function closeDayTagPicker() {
      if (_dayTagPopover) { _dayTagPopover.remove(); _dayTagPopover = null; }
      document.removeEventListener('click', closeDayTagPicker, true);
    }

    function openDayTagPicker(event, iso) {
      if (_dayTagPopover) { closeDayTagPicker(); return; }
      const rect = event.currentTarget.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'day-tag-popover';
      const current = (state.dayTags || {})[iso];
      pop.innerHTML = Object.entries(DAY_TAGS).map(([key, def]) => `
        <button class="day-tag-option" onclick="setDayTag('${iso}','${key}')">
          <span>${def.icon}</span><span>${esc(def.label)}</span>${current === key ? '<span style="margin-left:auto;color:var(--accent)">✓</span>' : ''}
        </button>`).join('') +
        (current ? `<button class="day-tag-option clear" onclick="setDayTag('${iso}',null)">✕ Clear tag</button>` : '');
      document.body.appendChild(pop);

      // Position within the viewport — prefer below-right of the badge, flip if it would overflow.
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = rect.left, top = rect.bottom + 4;
      if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
      if (top + ph > window.innerHeight - 8) top = rect.top - ph - 4;
      pop.style.left = Math.max(8, left) + 'px';
      pop.style.top = Math.max(8, top) + 'px';

      _dayTagPopover = pop;
      // Deferred so the triggering click (which is already bubbling) doesn't immediately close it.
      setTimeout(() => document.addEventListener('click', closeDayTagPicker, true), 0);
    }

    function setDayTag(iso, key) {
      if (!state.dayTags) state.dayTags = {};
      if (key) state.dayTags[iso] = key;
      else delete state.dayTags[iso];
      saveState();
      closeDayTagPicker();
      renderCalendar();
    }

    function renderCalWeek() {
      const weekStart = ui.calWeekStart;
      const colors = projectColors();
      const days = [];
      for (let i = 0; i < 7; i++) days.push(addDays(weekStart, i));
      const items = filteredItems();
      const meetingsByDate = getMeetingsByDate();

      const d0 = isoToDate(days[0]);
      const d6 = isoToDate(days[6]);
      document.getElementById('cal-title').textContent =
        `${d0.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ` +
        `${d6.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

      // Header: switch to week-mode (gutter + dated labels)
      const header = document.getElementById('cal-week-header');
      header.classList.add('week-mode');
      document.getElementById('cwl-gutter').style.display = '';
      for (let i = 0; i < 7; i++) {
        const iso = days[i];
        const d = isoToDate(iso);
        const lbl = document.getElementById('cwl-' + i);
        const dayTag = (state.dayTags || {})[iso];
        const tagDef = dayTag ? DAY_TAGS[dayTag] : null;
        const tagBadge = `<span class="cal-day-tag${tagDef ? '' : ' cal-day-tag-empty'}"${tagDef ? ` style="color:${tagDef.fg}" title="${esc(tagDef.label)}"` : ' title="Tag this day"'}
          onclick="event.stopPropagation(); openDayTagPicker(event,'${iso}')">${tagDef ? tagDef.icon : '+'}</span>`;
        lbl.innerHTML = `<span>${DAY_NAMES[i]} ${d.getDate()}</span>${tagBadge}`;
        lbl.classList.toggle('today', iso === TODAY);
      }

      const grid = document.getElementById('cal-grid');
      grid.classList.add('week-grid');
      grid.style.removeProperty('--cal-rows');

      const totalMin = WG_END_MIN - WG_START_MIN;
      const gridHeight = totalMin * WG_PX_PER_MIN;
      const slotHeight = WG_SLOT_MIN * WG_PX_PER_MIN;
      grid.style.setProperty('--wg-grid-height', gridHeight + 'px');
      grid.style.setProperty('--wg-slot-height', slotHeight + 'px');

      // ── All-day row: multi-day items, date-only items, untimed meetings ──
      const alldayCols = days.map(iso => {
        const isWE = isWeekend(iso);
        const isToday = iso === TODAY;
        const dayMeetings = (meetingsByDate[iso] || []).filter(m => !m.time);
        const dayItems = items.filter(it => {
          if (it.start > iso || iso > it.end) return false;
          if (it.start === it.end && it.start === iso && it.startTime) return false;
          return true;
        });

        const meetingPills = dayMeetings.map(m => meetingPillHtml(m, colors)).join('');
        const pills = dayItems.map(it => {
          const bg = it.color + '28';
          const bd = it.color + '88';
          const cont = it.start !== it.end && it.end > iso ? ' →' : '';
          return `<span class="cal-pill${it.done ? ' done' : ''}"
        style="background:${bg}; border:1px solid ${bd}; color:${it.color}"
        onclick="event.stopPropagation(); selectAndEdit('${it.id}')"
        title="${esc(it.title)}">${esc(it.title || '')}${cont}</span>`;
        }).join('');

        return `<div class="wg-allday-col${isWE ? ' weekend' : ''}${isToday ? ' today' : ''}"
      onclick="openDrawer(null, '${iso}')">${meetingPills}${pills}</div>`;
      }).join('');

      // ── Time gutter labels (hourly) ──
      const timeLabels = [];
      for (let m = WG_START_MIN; m <= WG_END_MIN; m += 60) {
        const top = (m - WG_START_MIN) * WG_PX_PER_MIN;
        timeLabels.push(`<div class="wg-time-label" style="top:${top}px">${minutesToTime(m)}</div>`);
      }

      // ── Day columns: working-hours band + timed items/meetings as blocks ──
      const dayCols = days.map(iso => {
        const isWE = isWeekend(iso);
        const isToday = iso === TODAY;

        let bands = '';
        if (!isWE) {
          bands = WORK_PERIODS.map(([s, e]) => {
            const top = (timeToMinutes(s) - WG_START_MIN) * WG_PX_PER_MIN;
            const height = (timeToMinutes(e) - timeToMinutes(s)) * WG_PX_PER_MIN;
            return `<div class="wg-work-band" style="top:${top}px; height:${height}px"></div>`;
          }).join('');
        }

        const blocks = [];
        items.forEach(it => {
          if (it.start === it.end && it.start === iso && it.startTime) {
            blocks.push({
              startMin: timeToMinutes(it.startTime),
              endMin: timeToMinutes(it.endTime || addMinutesToTime(it.startTime, 30)),
              type: 'item', it
            });
          }
        });
        (meetingsByDate[iso] || []).forEach(m => {
          if (m.time) {
            const startMin = timeToMinutes(m.time);
            blocks.push({ startMin, endMin: startMin + (m.durationMins || 30), type: 'meeting', m });
          }
        });

        const laneCount = layoutLanes(blocks);
        const laneW = 100 / laneCount;
        const blockHtml = blocks.map(b => {
          const top = Math.max(0, (b.startMin - WG_START_MIN) * WG_PX_PER_MIN);
          const height = Math.max((b.endMin - b.startMin) * WG_PX_PER_MIN, 16);
          const left = b.lane * laneW;
          if (b.type === 'meeting') {
            const m = b.m;
            const mc = m.projectId && colors[m.projectId] ? `;--mc:${esc(colors[m.projectId])}` : '';
            return `<div class="wg-block meeting${iso < TODAY ? ' past' : ''}${height < 36 ? ' short' : ''}" style="top:${top}px;height:${height}px;left:${left}%;width:${laneW}%${mc}"
        data-iso="${iso}"
        onmousedown="wgBlockMouseDown(event, 'meeting', '${m.id}', '${iso}', ${b.startMin}, ${b.endMin})"
        title="${esc(m.time + ' · ' + (m.title || 'Meeting'))}"><b class="pill-time">${esc(m.time)}</b>${m.recurring ? '🔁 ' : ''}${esc(m.title || 'Meeting')}<div class="wg-resize-handle" onmousedown="wgResizeMouseDown(event, 'meeting', '${m.id}', '${iso}', ${b.startMin}, ${b.endMin})"></div></div>`;
          }
          const it = b.it;
          const bg = it.color + '28';
          const bd = it.color + '88';
          return `<div class="wg-block${it.done ? ' done' : ''}" style="top:${top}px;height:${height}px;left:${left}%;width:${laneW}%; background:${bg}; border-color:${bd}; color:${it.color}"
        data-iso="${iso}"
        onmousedown="wgBlockMouseDown(event, 'item', '${it.id}', '${iso}', ${b.startMin}, ${b.endMin})"
        title="${esc(it.title)}">${esc(it.title || '(untitled)')}<div class="wg-resize-handle" onmousedown="wgResizeMouseDown(event, 'item', '${it.id}', '${iso}', ${b.startMin}, ${b.endMin})"></div></div>`;
        }).join('');

        return `<div class="wg-day-col${isWE ? ' weekend' : ''}${isToday ? ' today' : ''}"
      data-iso="${iso}"
      onclick="handleGridClick(event, '${iso}')">${bands}${blockHtml}</div>`;
      }).join('');

      grid.innerHTML = `
    <div class="wg-allday-row">
      <div class="cal-week-gutter"></div>
      ${alldayCols}
    </div>
    <div class="wg-grid-body">
      <div class="wg-time-col">${timeLabels.join('')}</div>
      ${dayCols}
    </div>`;
    }

    function handleGridClick(e, iso) {
      const col = e.currentTarget;
      const rect = col.getBoundingClientRect();
      const offsetY = e.clientY - rect.top;
      const totalMin = WG_END_MIN - WG_START_MIN;
      const gridHeight = totalMin * WG_PX_PER_MIN;
      const frac = Math.max(0, Math.min(1, offsetY / gridHeight));
      let mins = WG_START_MIN + frac * totalMin;
      mins = Math.round(mins / WG_SLOT_MIN) * WG_SLOT_MIN;
      mins = Math.min(mins, WG_END_MIN - WG_SLOT_MIN);
      openDrawer(null, iso, minutesToTime(mins));
    }

    // ═══════════════════════════════════════════════════════════════
    // Week-grid drag & resize
    // ═══════════════════════════════════════════════════════════════
    let _wgDrag = null;

    function wgBlockMouseDown(e, type, id, iso, startMin, endMin) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      _wgDrag = {
        mode: 'move',
        type, id,
        origIso: iso,
        origStartMin: startMin,
        origEndMin: endMin,
        duration: endMin - startMin,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        blockEl: e.currentTarget,
      };
      document.addEventListener('mousemove', wgDragMove);
      document.addEventListener('mouseup', wgDragEnd);
    }

    function wgResizeMouseDown(e, type, id, iso, startMin, endMin) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      _wgDrag = {
        mode: 'resize',
        type, id,
        origIso: iso,
        origStartMin: startMin,
        origEndMin: endMin,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        blockEl: e.currentTarget.parentElement,
      };
      document.addEventListener('mousemove', wgDragMove);
      document.addEventListener('mouseup', wgDragEnd);
    }

    function wgDragMove(e) {
      if (!_wgDrag) return;
      const dx = e.clientX - _wgDrag.startX;
      const dy = e.clientY - _wgDrag.startY;
      if (!_wgDrag.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      _wgDrag.moved = true;

      const deltaMin = Math.round(dy / WG_PX_PER_MIN / WG_SLOT_MIN) * WG_SLOT_MIN;

      if (_wgDrag.mode === 'resize') {
        let newEndMin = _wgDrag.origEndMin + deltaMin;
        newEndMin = Math.max(_wgDrag.origStartMin + WG_SLOT_MIN, Math.min(WG_END_MIN, newEndMin));
        _wgDrag.previewEndMin = newEndMin;
        const height = Math.max((newEndMin - _wgDrag.origStartMin) * WG_PX_PER_MIN, 16);
        _wgDrag.blockEl.style.height = height + 'px';
        _wgDrag.blockEl.classList.add('dragging');
      } else {
        let newStartMin = _wgDrag.origStartMin + deltaMin;
        newStartMin = Math.max(WG_START_MIN, Math.min(WG_END_MIN - _wgDrag.duration, newStartMin));
        _wgDrag.previewStartMin = newStartMin;

        const el = document.elementFromPoint(e.clientX, e.clientY);
        const col = el ? el.closest('.wg-day-col') : null;
        _wgDrag.previewIso = col ? col.dataset.iso : _wgDrag.origIso;

        const top = Math.max(0, (newStartMin - WG_START_MIN) * WG_PX_PER_MIN);
        _wgDrag.blockEl.style.top = top + 'px';
        _wgDrag.blockEl.style.left = '0%';
        _wgDrag.blockEl.style.width = '100%';
        _wgDrag.blockEl.classList.add('dragging');

        if (col && col !== _wgDrag.blockEl.parentElement) col.appendChild(_wgDrag.blockEl);
      }
    }

    function wgDragEnd(e) {
      document.removeEventListener('mousemove', wgDragMove);
      document.removeEventListener('mouseup', wgDragEnd);
      if (!_wgDrag) return;
      const drag = _wgDrag;
      _wgDrag = null;

      if (!drag.moved) {
        if (drag.type === 'meeting') {
          openMeetingPanel(drag.id, drag.origIso);
        } else {
          selectAndEdit(drag.id);
        }
        return;
      }

      if (drag.mode === 'resize') {
        const newEndTime = minutesToTime(drag.previewEndMin);
        if (drag.type === 'meeting') resizeMeeting(drag.id, drag.previewEndMin - drag.origStartMin, drag.origIso);
        else resizeItem(drag.id, newEndTime);
      } else {
        const newStartTime = minutesToTime(drag.previewStartMin);
        const newEndTime = minutesToTime(drag.previewStartMin + drag.duration);
        const newIso = drag.previewIso || drag.origIso;
        if (drag.type === 'meeting') moveMeeting(drag.id, newIso, newStartTime, drag.origIso);
        else moveItem(drag.id, newIso, newStartTime, newEndTime);
      }
      renderCalendar();
    }

    function moveItem(id, newIso, newStartTime, newEndTime) {
      const it = state.items.find(x => x.id === id);
      if (!it) return;
      it.start = newIso;
      it.end = newIso;
      it.startTime = newStartTime;
      it.endTime = newEndTime;
      saveState();
      showToast(`Moved to ${fmtDate(newIso)} ${newStartTime}`);
    }

    function resizeItem(id, newEndTime) {
      const it = state.items.find(x => x.id === id);
      if (!it) return;
      it.endTime = newEndTime;
      saveState();
    }

    // For a recurring series, occDate identifies which occurrence a pill represents
    // (the day-column it was dragged from) since m.id is shared across all its pills.
    function seriesAnchorOccurrenceLocal(occurrenceDates, todayStr) {
      if (!occurrenceDates || !occurrenceDates.length) return null;
      const upcoming = occurrenceDates.filter(o => o.date >= todayStr);
      return upcoming.length ? upcoming[0] : occurrenceDates[occurrenceDates.length - 1];
    }

    function moveMeeting(id, newIso, newTime, occDate) {
      let data;
      try { data = JSON.parse(localStorage.getItem('meetings-hub-v1') || '{}'); } catch { data = {}; }
      const m = (data.meetings || []).find(x => x.id === id);
      if (!m) return;
      if (m.recurring && occDate) {
        const occ = (m.occurrenceDates || []).find(o => o.date === occDate);
        if (!occ) return;
        occ.date = newIso;
        occ.time = newTime;
        m.occurrenceDates.sort((a, b) => a.date.localeCompare(b.date));
        const logEntry = (m.log || []).find(l => l.date === occDate);
        if (logEntry) logEntry.date = newIso;
        if (m.log) m.log.sort((a, b) => a.date.localeCompare(b.date));
        const anchor = seriesAnchorOccurrenceLocal(m.occurrenceDates, HubUtils.todayLocal());
        if (anchor) { m.date = anchor.date; m.time = anchor.time; m.durationMins = anchor.durationMins; }
      } else {
        m.date = newIso;
        m.time = newTime;
      }
      HubStorage.set('meetings-hub-v1', data);
      showToast(`Moved to ${fmtDate(newIso)} ${newTime}`);
    }

    function resizeMeeting(id, newDurationMins, occDate) {
      let data;
      try { data = JSON.parse(localStorage.getItem('meetings-hub-v1') || '{}'); } catch { data = {}; }
      const m = (data.meetings || []).find(x => x.id === id);
      if (!m) return;
      if (m.recurring && occDate) {
        const occ = (m.occurrenceDates || []).find(o => o.date === occDate);
        if (!occ) return;
        occ.durationMins = newDurationMins;
        const anchor = seriesAnchorOccurrenceLocal(m.occurrenceDates, HubUtils.todayLocal());
        if (anchor) { m.date = anchor.date; m.time = anchor.time; m.durationMins = anchor.durationMins; }
      } else {
        m.durationMins = newDurationMins;
      }
      HubStorage.set('meetings-hub-v1', data);
    }

    // ═══════════════════════════════════════════════════════════════
    // Toolbar
    // ═══════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════
    // Full render
    // ═══════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════
    // Multi-Project Gantt
    // ═══════════════════════════════════════════════════════════════

    const MULTI_LABEL_W = 240;
    const MULTI_COL_W   = 112;

    function getMultiConfig() {
      const isWeek    = ui.multiZoom !== 'month';
      const daysPerCol = isWeek ? 7 : 28;
      const numCols    = isWeek ? 14 : 13;
      const dayPx      = MULTI_COL_W / daysPerCol;
      const totalPx    = numCols * MULTI_COL_W;
      const lookBack   = isWeek ? Math.floor(numCols / 3) * daysPerCol : daysPerCol;
      const startIso   = addDays(isWeek ? getWeekStart(TODAY) : TODAY, -lookBack + ui.multiOffset);
      const endIso     = addDays(startIso, numCols * daysPerCol);
      return { isWeek, daysPerCol, numCols, dayPx, totalPx, startIso, endIso };
    }

    function multiDateX(iso, cfg) {
      if (!iso) return null;
      const ms = isoToDate(iso) - isoToDate(cfg.startIso);
      return Math.round(ms / 86400000 * cfg.dayPx);
    }

    // Meetings by project id ('' = no project), one entry per date (series expanded).
    function meetingsByProject() {
      const out = {};
      (_readMeetings().meetings || []).forEach(m => {
        if (m.archived) return;
        const dates = m.recurring ? (m.occurrenceDates || []).map(o => ({ date: o.date, time: o.time }))
                                  : (m.date ? [{ date: m.date, time: m.time }] : []);
        dates.forEach(d => (out[m.projectId || ''] = out[m.projectId || ''] || []).push({ id: m.id, title: m.title || 'Meeting', date: d.date, time: d.time || '' }));
      });
      return out;
    }

    // Schedule's own items by project id. Copies of Projects tasks are skipped
    // when their task is still there: the task row already shows it.
    function ownItemsByProject(projects) {
      const known = new Set();
      projects.forEach(p => { (p.tasks || []).forEach(t => known.add(t.id)); (p.milestones || []).forEach(ms => known.add(ms.id)); });
      const out = {};
      filteredItems().forEach(it => {
        if (it.sourceTool === 'project-hub' && known.has(it.sourceId)) return;
        (out[it.projectId || ''] = out[it.projectId || ''] || []).push(it);
      });
      return out;
    }

    // One Timeline: every open project with its milestones, tasks, meetings and
    // Schedule items, plus a "No project" group for the rest.
    function renderTimeline() {
      const scroll = document.getElementById('multi-gantt-scroll');
      if (!scroll) return;
      const cfg = getMultiConfig();
      document.getElementById('tl-zoom-week').classList.toggle('active', cfg.isWeek);
      document.getElementById('tl-zoom-month').classList.toggle('active', !cfg.isWeek);

      const rangeLabel = document.getElementById('multi-range-label');
      if (rangeLabel) {
        const fmt = iso => isoToDate(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: cfg.isWeek ? undefined : 'numeric' });
        rangeLabel.textContent = fmt(cfg.startIso) + ' – ' + fmt(addDays(cfg.endIso, -1));
      }

      let projects = [];
      try { projects = (JSON.parse(localStorage.getItem('project-hub-v1') || '{}').projects || []); } catch {}
      const meetings = meetingsByProject();
      const own = ownItemsByProject(projects);
      const groups = projects.filter(p => p.status !== 'done').map(p => ({ proj: p, id: p.id, name: p.name, color: p.color || 'var(--text3)' }));
      if ((meetings[''] || []).length || (own[''] || []).length) groups.push({ proj: null, id: '', name: 'No project', color: 'var(--text3)' });

      if (!groups.length) {
        scroll.innerHTML = `<div class="multi-empty">
          <div class="multi-empty-icon">📅</div>
          <div style="font-weight:600;color:var(--text2)">Nothing to show yet.</div>
          <div style="font-size:12px">Projects, meetings and items with dates appear here.</div>
        </div>`;
        return;
      }

      const cols = [];
      for (let i = 0; i < cfg.numCols; i++) {
        const iso = addDays(cfg.startIso, i * cfg.daysPerCol);
        const isToday = iso <= TODAY && addDays(iso, cfg.daysPerCol) > TODAY;
        const label = cfg.isWeek
          ? isoToDate(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
          : isoToDate(iso).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        cols.push({ iso, label, isToday, x: i * MULTI_COL_W });
      }
      const todayX = multiDateX(TODAY, cfg);
      const todayVisible = todayX !== null && todayX >= 0 && todayX <= cfg.totalPx;
      const inView = x => x !== null && x > -20 && x < cfg.totalPx + 20;

      function ganttBg(rowH) {
        const bands = cols.map(c =>
          `<div class="g-col-band${c.isToday ? ' is-today' : ''}" style="left:${c.x}px;width:${MULTI_COL_W}px"></div>`).join('');
        const tl = todayVisible ? `<div class="g-today-line" style="left:${todayX}px;height:${rowH}px"></div>` : '';
        return bands + tl;
      }
      const row = (cls, label, gantt, h) => `
        <div class="mrow ${cls}">
          <div class="mrow-label">${label}</div>
          <div class="mrow-gantt" style="width:${cfg.totalPx}px;height:${h}px">${ganttBg(h)}${gantt}</div>
        </div>`;

      let html = `
        <div class="multi-hdr-row">
          <div class="multi-hdr-corner">Project / item</div>
          ${cols.map(c => `<div class="multi-col-hdr${c.isToday ? ' is-today' : ''}" style="width:${MULTI_COL_W}px">${esc(c.label)}</div>`).join('')}
        </div>`;

      groups.forEach(g => {
        const p = g.proj;
        const color = g.color;
        const collapsed = ui.collapsedProjects.has(g.id || '__none');
        const tasks = p ? (p.tasks || []).filter(t => t.due && !t.done).sort((a, b) => a.due.localeCompare(b.due)) : [];
        const milestones = p ? (p.milestones || []).filter(ms => ms.date).sort((a, b) => a.date.localeCompare(b.date)) : [];
        const items = (own[g.id] || []).slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''));
        const meets = (meetings[g.id] || []);
        const openCount = p ? (p.tasks || []).filter(t => !t.done).length : 0;
        const noDue = p ? (p.tasks || []).filter(t => !t.due && !t.done).length : 0;
        const upcomingMeets = meets.filter(m => m.date >= TODAY).length;
        const meta = [];
        if (p) meta.push(`${openCount} open`);
        if (noDue) meta.push(`${noDue} undated`);
        if (upcomingMeets) meta.push(`${upcomingMeets} mtg`);

        // Project row: its meetings as ticks on the lane.
        const ticks = meets.map(m => {
          const x = multiDateX(m.date, cfg);
          if (!inView(x)) return '';
          const tip = `${fmtDate(m.date)}${m.time ? ' ' + m.time : ''} · ${m.title}`;
          return `<button class="g-meet${m.date < TODAY ? ' past' : ''}" style="left:${x + cfg.dayPx / 2}px" title="${esc(tip)}"
            onclick="openMeetingPanel('${esc(m.id)}','${m.date}')"></button>`;
        }).join('');
        html += row('mrow-proj', `
            <button class="proj-toggle" onclick="toggleProjectCollapse('${esc(g.id || '__none')}')" aria-expanded="${!collapsed}">
              <span class="proj-chevron">${collapsed ? '▸' : '▾'}</span>
              <span class="proj-color-bar" style="background:${esc(color)}"></span>
              <span class="proj-name">${esc(g.name)}</span>
              <span class="proj-meta">${meta.join(' · ')}</span>
            </button>`, `<div class="g-lane" style="background:${esc(color)}"></div>${ticks}`, 38);

        if (collapsed) return;

        milestones.forEach(ms => {
          const x = multiDateX(ms.date, cfg);
          const mark = inView(x) ? `<div class="g-diamond${ms.done ? ' is-done' : ''}" style="left:${x + cfg.dayPx / 2}px;background:${esc(color)}" title="${esc(fmtDate(ms.date))}"></div>
            <span class="g-tag" style="left:${x + cfg.dayPx / 2 + 10}px">${esc(ms.name || ms.title || '')}</span>` : '';
          html += row(`mrow-item${ms.done ? ' is-done' : ''}`, `
              <span class="ms-icon" style="color:${esc(color)}">◆</span>
              <span class="item-label-text">${esc(ms.name || ms.title || 'Milestone')}</span>
              <span class="item-due-badge${ms.date < TODAY && !ms.done ? ' overdue' : ''}">${fmtDate(ms.date)}</span>`, mark, 30);
        });

        tasks.forEach(t => {
          const x = multiDateX(t.due, cfg);
          const end = x === null ? null : x + cfg.dayPx;
          const barW = Math.max(10, Math.round(cfg.dayPx * 5));
          const mark = inView(x) ? `<div class="g-bar" style="left:${Math.max(0, end - barW)}px;width:${barW}px;background:${esc(color)}"></div>
            <div class="g-due" style="left:${end}px;background:${esc(color)}"></div>` : '';
          html += row('mrow-item', `
              <span class="task-dot"></span>
              <span class="item-label-text">${esc(t.title)}</span>
              <span class="item-due-badge${t.due < TODAY ? ' overdue' : ''}">${fmtDate(t.due)}</span>`, mark, 30);
        });

        items.forEach(it => {
          const xs = multiDateX(it.start, cfg), xe = multiDateX(it.end || it.start, cfg);
          let mark = '';
          if (it.type === 'milestone') {
            if (inView(xs)) mark = `<div class="g-diamond${it.done ? ' is-done' : ''}" style="left:${xs + cfg.dayPx / 2}px;background:${esc(it.color)}"></div>`;
          } else if (xe !== null && xe + cfg.dayPx > 0 && xs < cfg.totalPx) {
            const l = Math.max(0, xs), w = Math.max(10, xe + cfg.dayPx - l);
            mark = `<div class="g-bar item${it.done ? ' is-done' : ''}" style="left:${l}px;width:${w}px;background:${esc(it.color)}"></div>`;
          }
          html += row(`mrow-item mrow-click${it.done ? ' is-done' : ''}`, `
              <button class="item-open" onclick="selectAndEdit('${esc(it.id)}')">
                <span class="task-dot" style="background:${esc(it.color)}"></span>
                <span class="item-label-text">${esc(it.title || '(untitled)')}</span>
                <span class="item-due-badge">${fmtDate(it.start)}</span>
              </button>`, mark, 30);
        });

        if (!milestones.length && !tasks.length && !items.length) {
          html += row('mrow-item mrow-empty', `<span class="item-label-text">${meets.length ? 'Only meetings so far' : 'No dated tasks'}</span>`, '', 26);
        }
      });

      scroll.innerHTML = html;
      if (todayVisible && !ui.multiOffset) {
        setTimeout(() => { scroll.scrollLeft = Math.max(0, todayX - scroll.clientWidth * 0.25 + MULTI_LABEL_W); }, 30);
      }
    }

    function toggleProjectCollapse(projId) {
      if (ui.collapsedProjects.has(projId)) ui.collapsedProjects.delete(projId);
      else ui.collapsedProjects.add(projId);
      renderTimeline();
    }

    function multiNav(dir) {
      const cfg = getMultiConfig();
      ui.multiOffset += dir * cfg.daysPerCol * 2;
      renderTimeline();
    }

    function multiToday() {
      ui.multiOffset = 0;
      renderTimeline();
    }

    function setMultiZoom(z) {
      ui.multiZoom = z;
      ui.multiOffset = 0;
      renderTimeline();
    }

    function render() {
      if (ui.activeView === 'timeline') renderTimeline();
      else renderCalendar();
    }

    // ═══════════════════════════════════════════════════════════════
    // View controls
    // ═══════════════════════════════════════════════════════════════
    function switchView(view) {
      ui.activeView = view === 'timeline' ? 'timeline' : 'calendar';
      document.getElementById('btn-timeline').classList.toggle('active', ui.activeView === 'timeline');
      document.getElementById('btn-calendar').classList.toggle('active', ui.activeView === 'calendar');
      document.getElementById('view-timeline').classList.toggle('view-hidden', ui.activeView !== 'timeline');
      document.getElementById('view-calendar').classList.toggle('view-hidden', ui.activeView !== 'calendar');
      render();
    }

    // ═══════════════════════════════════════════════════════════════
    // Selection
    // ═══════════════════════════════════════════════════════════════
    function selectAndEdit(id) {
      ui.selectedId = id;
      openDrawer(id);
    }

    // "t": back to today in the open view.
    function goToday() {
      if (ui.activeView === 'timeline') multiToday();
      else calToday();
    }

    // ═══════════════════════════════════════════════════════════════
    // Calendar navigation
    // ═══════════════════════════════════════════════════════════════
    function calNav(dir) {
      if (ui.calWeekMode) {
        ui.calWeekStart = addDays(ui.calWeekStart, dir * 7);
      } else {
        ui.calMonth += dir;
        if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
        if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
      }
      renderCalendar();
    }

    function calToday() {
      ui.calYear = new Date().getFullYear();
      ui.calMonth = new Date().getMonth();
      ui.calWeekStart = getWeekStart(TODAY);
      renderCalendar();
    }

    // Month ⇄ week. The week shown is the one holding today when it is in the
    // month on screen, else the month's first week; going back picks that week's month.
    function setCalMode(week) {
      if (week === ui.calWeekMode) return;
      if (week) {
        const first = `${ui.calYear}-${String(ui.calMonth + 1).padStart(2, '0')}-01`;
        const inMonth = TODAY.slice(0, 7) === first.slice(0, 7);
        ui.calWeekStart = getWeekStart(inMonth ? TODAY : first);
      } else {
        const mid = isoToDate(addDays(ui.calWeekStart, 3));
        ui.calYear = mid.getFullYear(); ui.calMonth = mid.getMonth();
      }
      ui.calWeekMode = week;
      renderCalendar();
    }

    function toggleCalWeek() { setCalMode(!ui.calWeekMode); }

    // ═══════════════════════════════════════════════════════════════
    // Drawer
    // ═══════════════════════════════════════════════════════════════
    function buildSwatches(selected) {
      document.getElementById('color-swatches').innerHTML = PALETTE.map(c =>
        `<div class="sch-color-swatch${c === selected ? ' selected' : ''}"
      style="background:${c}" onclick="pickColor('${c}')"></div>`
      ).join('');
    }

    function pickColor(c) {
      _drawerColor = c;
      buildSwatches(c);
    }

    function openDrawer(id, prefillDate, prefillTime) {
      closeMeetingPanel();
      ui.drawerItemId = id;
      const item = id ? state.items.find(it => it.id === id) : null;

      document.getElementById('drawer-title').textContent = item ? 'Edit Item' : 'Add Item';
      document.getElementById('drawer-delete-btn').style.display = item ? '' : 'none';
      document.getElementById('drawer-badge').style.display = (item && item.sourceTool) ? '' : 'none';

      const defaultDate = prefillDate || TODAY;
      document.getElementById('f-title').value = item ? (item.title || '') : '';
      document.getElementById('f-type').value = item ? (item.type || 'task') : 'task';
      document.getElementById('f-start').value = item ? (item.start || defaultDate) : defaultDate;
      document.getElementById('f-end').value = item ? (item.end || defaultDate) : defaultDate;
      document.getElementById('f-start-time').value = item ? (item.startTime || '') : (prefillTime || '');
      document.getElementById('f-end-time').value = item ? (item.endTime || '') : '';
      document.getElementById('f-project').value = item ? (item.projectId || '') : '';
      document.getElementById('f-notes').value = item ? (item.notes || '') : '';
      document.getElementById('f-done').checked = item ? !!item.done : false;

      _drawerColor = item ? (item.color || PALETTE[2]) : PALETTE[2];
      buildSwatches(_drawerColor);

      document.getElementById('sch-drawer').classList.add('open');
      setTimeout(() => document.getElementById('f-title').focus(), 180);
    }

    function closeDrawer() {
      document.getElementById('sch-drawer').classList.remove('open');
      ui.drawerItemId = null;
    }

    function saveDrawer() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) { showToast('Please enter a title.'); return; }

      const start = document.getElementById('f-start').value || TODAY;
      let end = document.getElementById('f-end').value || start;
      if (end < start) end = start;

      const startTime = document.getElementById('f-start-time').value;
      let endTime = document.getElementById('f-end-time').value;
      if (startTime && (!endTime || endTime <= startTime)) endTime = addMinutesToTime(startTime, 30);

      const patch = {
        title,
        type: document.getElementById('f-type').value,
        start, end,
        startTime: startTime || null,
        endTime: startTime ? endTime : null,
        color: _drawerColor,
        projectId: document.getElementById('f-project').value || null,
        projectRef: (() => {
          const pid = document.getElementById('f-project').value;
          const proj = pid ? HubData.getProject(pid) : null;
          return proj ? proj.name : null;
        })(),
        notes: document.getElementById('f-notes').value.trim(),
        done: document.getElementById('f-done').checked,
      };

      if (ui.drawerItemId) {
        const idx = state.items.findIndex(it => it.id === ui.drawerItemId);
        if (idx >= 0) Object.assign(state.items[idx], patch);
      } else {
        state.items.push({
          id: uid(), sourceTool: null, sourceId: null,
          createdAt: new Date().toISOString(), ...patch,
        });
      }

      saveState();
      closeDrawer();
      render();
      showToast(ui.drawerItemId ? 'Item updated.' : 'Item added.');
    }

    function deleteCurrentItem() {
      const id = ui.drawerItemId;
      if (!id || !confirm('Delete this item?')) return;
      state.items = state.items.filter(it => it.id !== id);
      if (ui.selectedId === id) ui.selectedId = null;
      saveState();
      closeDrawer();
      render();
      showToast('Item deleted.');
    }

    // ═══════════════════════════════════════════════════════════════
    // Toast
    // ═══════════════════════════════════════════════════════════════
    let _toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('sch-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // ═══════════════════════════════════════════════════════════════
    // Keyboard shortcuts
    // ═══════════════════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (document.getElementById('sch-meeting-drawer').classList.contains('open')) {
          closeMeetingPanel();
        } else if (document.getElementById('sch-drawer').classList.contains('open')) {
          closeDrawer();
        } else {
          try { window.parent.postMessage({ type: 'hub-home' }, window.location.origin || '*'); } catch { }
        }
        return;
      }
      if (e.key === 't' && !e.target.closest('input, textarea, select')) {
        goToday();
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // Auto-sync imported Projects items
    // ═══════════════════════════════════════════════════════════════
    function syncFromProjectHub() {
      const phData = HubStorage.get('project-hub-v1');
      if (!phData) return;

      const taskMap = {};
      const msMap = {};
      for (const project of (phData.projects || [])) {
        for (const task of (project.tasks || [])) {
          taskMap[task.id] = { task, project };
        }
        for (const ms of (project.milestones || [])) {
          msMap[ms.id] = { ms, project };
        }
      }

      let changed = false;
      state.items.forEach(item => {
        if (item.sourceTool !== 'project-hub') return;
        const entry = taskMap[item.sourceId] || msMap[item.sourceId];
        if (!entry) return;
        const src = entry.task || entry.ms;
        const srcTitle = src.title || src.name || '';
        const srcDate = src.due || src.date || item.start;
        const srcDone = !!src.done;
        if (item.title !== srcTitle || item.start !== srcDate || item.end !== srcDate || item.done !== srcDone) {
          item.title = srcTitle;
          item.start = srcDate;
          item.end = srcDate;
          item.done = srcDone;
          changed = true;
        }
      });

      if (changed) { saveState(); render(); }
    }

    // ═══════════════════════════════════════════════════════════════
    // Meeting panel (P164)
    // Clicking a meeting used to jump to Meetings, and back again for the
    // next one: Schedule ⇄ Meetings was the most common move in the hub. The
    // panel shows the meeting here; Meetings stays one click away.
    // ═══════════════════════════════════════════════════════════════
    let _meetingPanel = null; // { id, date }

    function _readMeetings() {
      try { return JSON.parse(localStorage.getItem('meetings-hub-v1') || '{}'); } catch { return {}; }
    }

    function openMeetingPanel(id, date) {
      const data = _readMeetings();
      const m = (data.meetings || []).find(x => x.id === id);
      if (!m) return;
      closeDrawer();
      _meetingPanel = { id, date: date || m.date };
      const occ = m.recurring ? ((m.occurrenceDates || []).find(o => o.date === date) || {}) : m;
      const log = m.recurring ? ((m.log || []).find(l => l.date === date) || {}) : m;
      const when = [date || m.date, occ.time, occ.durationMins ? occ.durationMins + ' min' : '']
        .filter(Boolean).join(' · ');
      const notes = String(log.notes || '').trim();
      const actions = (log.actionItems || []).filter(a => !a.done);
      const projects = HubData.getProjects().slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      document.getElementById('mp-title').textContent = (m.recurring ? '🔁 ' : '▣ ') + (m.title || 'Meeting');
      document.getElementById('mp-body').innerHTML = `
        <div class="sch-field"><div class="mp-when">${esc(when)}</div></div>
        <div class="sch-field">
          <label class="sch-label" for="mp-project">Project</label>
          <select class="sch-input" id="mp-project">
            <option value="">— none —</option>
            ${projects.map(p => `<option value="${esc(p.id)}"${p.id === m.projectId ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="sch-field">
          <label class="sch-label" for="mp-outcome">Desired outcome</label>
          <input class="sch-input" id="mp-outcome" type="text" value="${esc(m.desiredOutcome || '')}" placeholder="What should this meeting decide or produce?" />
        </div>
        ${m.obsidianNote ? `<div class="sch-field"><label class="sch-label">Vault note</label><div class="mp-note-path">⟡ ${esc(m.obsidianNote)}</div></div>` : ''}
        ${actions.length ? `<div class="sch-field"><label class="sch-label">Open actions</label>
          ${actions.map(a => `<div class="mp-action">○ ${esc(a.text || '')}</div>`).join('')}</div>` : ''}
        <div class="sch-field">
          <label class="sch-label">Notes</label>
          <div class="mp-notes">${notes ? esc(notes.length > 600 ? notes.slice(0, 599) + '…' : notes) : '<span class="mp-empty">No notes yet.</span>'}</div>
        </div>`;
      document.getElementById('sch-meeting-drawer').classList.add('open');
    }

    function closeMeetingPanel() {
      const d = document.getElementById('sch-meeting-drawer');
      if (d) d.classList.remove('open');
      _meetingPanel = null;
    }

    function saveMeetingPanel() {
      if (!_meetingPanel) return;
      const data = _readMeetings();
      const m = (data.meetings || []).find(x => x.id === _meetingPanel.id);
      if (!m) { closeMeetingPanel(); return; }
      const sel = document.getElementById('mp-project');
      m.projectId = sel.value || null;
      m.projectName = sel.value ? sel.options[sel.selectedIndex].text : null;
      m.desiredOutcome = document.getElementById('mp-outcome').value.trim();
      if (typeof HubUtils !== 'undefined' && HubUtils.stampUpdate) HubUtils.stampUpdate(m);
      HubStorage.set('meetings-hub-v1', data);
      closeMeetingPanel();
      showToast('Meeting saved');
      render();
    }

    function openMeetingInHub() {
      if (!_meetingPanel) return;
      const id = _meetingPanel.id;
      closeMeetingPanel();
      parent.postMessage({ type: 'hub-navigate', tool: 'meetings-hub', itemId: id }, window.location.origin || '*');
    }

    // ═══════════════════════════════════════════════════════════════
    // Project select helpers
    // ═══════════════════════════════════════════════════════════════
    function _populateProjectSelect() {
      const sel = document.getElementById('f-project');
      if (!sel) return;
      const prev = sel.value;
      sel.innerHTML = '<option value="">— none —</option>';
      HubData.getProjects().slice().sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
      if (prev && sel.querySelector('option[value="' + CSS.escape(prev) + '"]')) sel.value = prev;
    }

    // ═══════════════════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════════════════
    state = loadState();
    try {
      _populateProjectSelect();
      HubData.onChange(() => {
        _populateProjectSelect();
        syncFromProjectHub();
        if (ui.activeView === 'timeline') renderTimeline();
      });
    } catch { }
    // Initialize view state (sets view-hidden classes + filter section visibility) then render
    switchView(ui.activeView);
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HubBootstrap.start('schedule');
    });
  </script>
</body>

</html>
